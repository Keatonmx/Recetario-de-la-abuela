<title>Recetario de la Abuela</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&family=Shrikhand&family=Young+Serif&display=swap">
<style>
/* Layout: single-column phone app (max 560px). Papel picado masthead, lotería-card deck grouped under rótulo headings, tabbed recipe detail, fixed bottom nav.
   Palette: masa cream by day, comal black by night; rosa mexicano, chile, cempasúchil and nopal as accents. Lotería cards stay cream card stock with black ink in both. */
:root{
  --paper:#F5EDDF; --card:#FFFAF1; --ink:#1E1813; --muted:#6E6256; --line:#E2D5C1;
  --talavera:#B4005C; --talavera-soft:#F9E1EC;
  --chile:#A8261B; --chile-soft:#F6E0D9;
  --maiz:#B87A0E; --maiz-soft:#F7E9C8;
  --nopal:#276B42; --nopal-soft:#E0EDDC;
  --rosa:#C4336B; --on-accent:#FFFFFF;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --nav-h:64px;
  --stock:#FFFDF7; --stock-ink:#1D1A17; --stock-muted:#5E5A55; --line-ink:#1D1A17; --shadow:#1E1813;
  --mx-rosa:#C70067; --mx-verde:#1F6B3F; --on-rosa:#FFFFFF;
  --lift:#2A1608; --lift-amt:24%; --boost-scale:1;
  --f-rotulo:"Shrikhand", "Young Serif", Georgia, serif;
  --f-slab:"Alfa Slab One", "Rockwell", "Roboto Slab", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15110E; --card:#211B16; --ink:#F3EADB; --muted:#AD9F8E; --line:#3A3027;
    --talavera:#FF7DBE; --talavera-soft:#3B1A2B;
    --chile:#F28A6E; --chile-soft:#3A211B;
    --maiz:#F2C35C; --maiz-soft:#342816;
    --nopal:#7CC690; --nopal-soft:#1B2E20;
    --rosa:#EE80A9; --on-accent:#15110E; color-scheme:dark;
    --stock:#F5EDDF; --shadow:#000000; --line-ink:#120F0C; --mx-rosa:#FF5FAE; --mx-verde:#7CC690; --on-rosa:#15110E; --lift:#FFFFFF; --lift-amt:38%; --boost-scale:0;
  }
}
:root[data-theme="dark"]{
    --paper:#15110E; --card:#211B16; --ink:#F3EADB; --muted:#AD9F8E; --line:#3A3027;
    --talavera:#FF7DBE; --talavera-soft:#3B1A2B;
    --chile:#F28A6E; --chile-soft:#3A211B;
    --maiz:#F2C35C; --maiz-soft:#342816;
    --nopal:#7CC690; --nopal-soft:#1B2E20;
    --rosa:#EE80A9; --on-accent:#15110E; color-scheme:dark;
    --stock:#F5EDDF; --shadow:#000000; --line-ink:#120F0C; --mx-rosa:#FF5FAE; --mx-verde:#7CC690; --on-rosa:#15110E; --lift:#FFFFFF; --lift-amt:38%; --boost-scale:0;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body);
  font-size:16px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  -webkit-tap-highlight-color:transparent;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--paper)}
.app{max-width:560px;margin:0 auto}
h1,h2,h3,h4{text-wrap:balance;margin:0}
a{color:var(--talavera)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--talavera);outline-offset:2px;border-radius:6px}
.label{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Papel picado */
.picado{display:flex;justify-content:space-between;gap:6px;border-top:2px solid var(--muted);padding-top:0;margin-top:10px}
.flag{flex:1 1 0;max-width:52px;aspect-ratio:60/68;background:var(--c);-webkit-mask:var(--picado) center/contain no-repeat;mask:var(--picado) center/contain no-repeat;transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.flag:nth-child(5n+1){--c:var(--chile)} .flag:nth-child(5n+2){--c:var(--maiz)} .flag:nth-child(5n+3){--c:var(--talavera)} .flag:nth-child(5n+4){--c:var(--rosa)} .flag:nth-child(5n){--c:var(--nopal)}
.flag:nth-child(odd){animation-delay:-2.5s}
.flag:nth-child(3n){animation-duration:6s}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@media (prefers-reduced-motion: reduce){.flag{animation:none}}

/* Home */
.mast{display:grid;gap:6px;padding-block:18px 6px}
.mast h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.1rem, 9vw, 2.8rem);line-height:1.02;letter-spacing:-.01em}
.mast h1 em{font-style:normal;color:var(--chile)}
.mast p{margin:0;color:var(--muted);max-width:36ch}
.filters{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);display:grid;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 40px}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.pc[aria-pressed="true"]{background:var(--nopal);border-color:var(--nopal);color:var(--on-accent)}
.count{font-size:.85rem;color:var(--muted);margin:14px 0 0}
.cat{display:grid;gap:10px;margin-top:22px}
.cat h2{font-family:var(--f-display);font-weight:400;font-size:1.4rem;display:flex;align-items:baseline;gap:10px}
.cat h2 small{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 14px 16px}
.card:hover{border-color:var(--talavera)}
.card .nm{font-family:var(--f-display);font-size:1.22rem;line-height:1.15}
.card .en{color:var(--muted);font-size:.92rem}
.card .chev{grid-row:1 / span 3;grid-column:2;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .chev .star{color:var(--maiz)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:.76rem;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.pc{background:var(--nopal-soft);color:var(--nopal);border-color:transparent;font-weight:700}
.badge.var{background:var(--talavera-soft);color:var(--talavera);border-color:transparent;font-weight:700}
.empty{margin-top:28px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:1.25rem;margin-bottom:4px}

/* Detail */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--paper);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--talavera);font-weight:700;padding:6px 4px}
.topbar .tt{font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.topbar.scrolled .tt{opacity:1}
.tools{display:flex;gap:6px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.85rem;font-weight:700}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"].fav{color:var(--maiz);border-color:var(--maiz)}
.icon-btn[aria-pressed="true"].cook{background:var(--talavera);color:var(--on-accent);border-color:var(--talavera)}
.cookmsg{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.hero{display:grid;gap:8px;padding-block:20px 6px}
.eyebrow{color:var(--chile);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem, 8.5vw, 2.6rem);line-height:1.04}
.hero .en{font-style:italic;color:var(--muted);font-size:1.05rem}
.story{margin:6px 0 0;max-width:65ch}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px}
.meta div{background:var(--card);padding:10px 12px;display:grid;gap:2px;min-width:0}
.meta dt{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.meta dd{margin:0;font-family:var(--f-mono);font-size:.9rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.meta .pcv dd{color:var(--nopal)}
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{flex:none;background:none;border:0;padding:10px 12px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--chile)}
.tab .n{font-family:var(--f-mono);font-size:.78rem;margin-left:4px}
.panel{display:grid;gap:22px;padding-top:18px}
.panel h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.reset{background:none;border:0;color:var(--talavera);font-size:.85rem;font-weight:700;cursor:pointer;padding:4px 0;font-family:var(--f-body)}
.group{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--chile);margin:14px 0 4px}
.group:first-child{margin-top:4px}
.ings{list-style:none;margin:0;padding:0;display:grid}
.ing{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ing input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:1px 0 0;border:2px solid var(--muted);border-radius:6px;background:var(--card);display:grid;place-items:center;cursor:pointer}
.ing input:checked{background:var(--nopal);border-color:var(--nopal)}
.ing input:checked::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ing.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 12px;cursor:pointer;line-height:1.55}
.step .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--talavera-soft);color:var(--talavera);font-family:var(--f-mono);font-size:.85rem}
.step.done{background:transparent}
.step.done .t{color:var(--muted)}
.step.done .n{background:var(--nopal);color:var(--on-accent)}
.hint{font-size:.85rem;color:var(--muted);margin:-12px 0 0}
.secretos{background:var(--chile-soft);border-radius:16px;padding:16px 18px}
.secretos h3{color:var(--chile);font-size:1.2rem}
.secretos ul{margin:10px 0 0;padding-left:1.1em;display:grid;gap:8px}
.pcbox{background:var(--nopal-soft);border-radius:16px;padding:16px 18px;display:grid;gap:6px}
.pcbox .big{font-family:var(--f-mono);font-size:1.05rem;color:var(--nopal);font-variant-numeric:tabular-nums}
.pcbox p{margin:0}
.note{background:var(--maiz-soft);border-radius:14px;padding:12px 14px;margin:0}
.note b{color:var(--ink)}
details.var{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
details.var summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
details.var summary::-webkit-details-marker{display:none}
details.var summary .nm{font-family:var(--f-display);font-size:1.25rem;line-height:1.15}
details.var summary .en{color:var(--muted);font-size:.92rem}
details.var summary .rg{color:var(--chile);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
details.var summary .tw{grid-row:1 / span 3;grid-column:2;transition:transform .2s;color:var(--muted)}
details.var[open] summary .tw{transform:rotate(90deg)}
details.var .vb{padding:0 16px 16px;display:grid;gap:16px}
details.var .vb > p{margin:0;max-width:65ch}

/* Despensa */
.pantry{display:grid;gap:26px;padding-block:20px 0}
.pantry > header h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem, 8.5vw, 2.6rem);line-height:1.04}
.pantry > header p{margin:6px 0 0;color:var(--muted)}
.pantry h2{font-family:var(--f-display);font-weight:400;font-size:1.4rem;margin-bottom:10px}
.chiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.chilec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:4px;align-content:start}
.chilec .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.chilec .nm{font-family:var(--f-display);font-size:1.15rem}
.heat{display:inline-flex;gap:3px}
.heat i{width:8px;height:14px;border-radius:4px 4px 6px 6px;background:var(--line)}
.heat i.on{background:var(--chile)}
.chilec .f{font-size:.82rem;color:var(--muted)}
.chilec .u{font-size:.88rem}
.howto{margin:0;padding-left:1.3em;display:grid;gap:8px;max-width:65ch}
.gloss{margin:0;display:grid;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gloss div{padding:12px 14px;border-bottom:1px solid var(--line)}
.gloss div:last-child{border-bottom:0}
.gloss dt{font-weight:700}
.gloss dd{margin:2px 0 0;color:var(--muted)}
.reading{margin:0;padding-left:1.1em;display:grid;gap:6px;color:var(--muted)}
.reading i{color:var(--ink)}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.nav .in{max-width:560px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:grid;place-items:center;align-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:700;letter-spacing:.03em}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--chile)}

/* Cook mode */
html.cook body{font-size:19px}
html.cook .step{padding:16px}
html.cook .ing{padding:12px 0}

/* ---------- Lotería redesign ---------- */
.rotulo{font-family:var(--f-rotulo);font-weight:400;line-height:1.08;letter-spacing:.005em;text-shadow:2px 2px 0 var(--shadow)}
.mast{padding-block:4px 2px;gap:10px}
.mast .picado{margin-top:0}
.mast h1.rotulo{font-family:var(--f-rotulo);font-size:clamp(2.4rem, 11vw, 3.2rem);line-height:1;color:var(--mx-rosa);margin-top:16px;text-shadow:3px 3px 0 var(--shadow)}
.mast h1 .de{display:block;font-size:.62em;color:var(--mx-verde);margin-top:4px}
.mast .tag{font-family:var(--f-slab);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--chile);max-width:none}
.tiles{height:12px;background:var(--tile) repeat-x left center / 12px 12px;border-block:2px solid var(--line-ink);border-radius:2px}
.cat{margin-top:34px;gap:10px}
.cat > header{display:grid;gap:8px}
.cat h2.rotulo{font-size:2rem;color:color-mix(in srgb, var(--g), var(--lift) calc(var(--lift-amt) + var(--boost, 0%) * var(--boost-scale)));display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cat h2 small{font-family:var(--f-slab);font-size:.8rem;color:var(--muted);text-shadow:none;letter-spacing:.06em;text-transform:uppercase}
.deck{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:16px 14px;margin-top:6px}
.loteria{position:relative;display:flex;flex-direction:column;gap:7px;text-decoration:none;color:var(--stock-ink);background:var(--stock);border:2px solid var(--line-ink);border-radius:10px;padding:7px 7px 10px;box-shadow:3px 4px 0 var(--shadow);transition:transform .16s ease, box-shadow .16s ease;min-width:0}
.deck .loteria:nth-child(4n+1){transform:rotate(-.8deg)}
.deck .loteria:nth-child(4n+2){transform:rotate(.6deg)}
.deck .loteria:nth-child(4n+3){transform:rotate(.4deg)}
.deck .loteria:nth-child(4n){transform:rotate(-.5deg)}
.deck .loteria:hover,.deck .loteria:focus-visible{transform:rotate(0) translate(-1px,-3px);box-shadow:5px 7px 0 var(--shadow)}
.deck .loteria:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
@media (prefers-reduced-motion: reduce){.loteria{transition:none}}
.art{position:relative;aspect-ratio:1/1;border:2.5px solid var(--line-ink);border-radius:4px;overflow:hidden;background:color-mix(in srgb, var(--g) 78%, #fff)}
.art svg{position:absolute;inset:7%;width:86%;height:86%;overflow:visible}
.art .no{position:absolute;top:0;left:0;background:var(--stock);color:var(--stock-ink);font-family:var(--f-slab);font-size:.8rem;line-height:1;padding:4px 7px 5px 5px;border-right:2.5px solid var(--line-ink);border-bottom:2.5px solid var(--line-ink);border-bottom-right-radius:5px;font-variant-numeric:tabular-nums;z-index:1}
.art .stamp{position:absolute;right:5px;bottom:6px;transform:rotate(-7deg);font-family:var(--f-slab);font-size:.56rem;letter-spacing:.07em;line-height:1.1;color:#1F6B3F;background:#F7F5EE;border:2px solid #1F6B3F;border-radius:4px;padding:3px 5px;z-index:1;text-transform:uppercase}
.art .heart{position:absolute;top:4px;right:4px;width:24px;height:24px;z-index:1;filter:drop-shadow(1px 1px 0 #1D1A17)}
.loteria .nm{font-family:var(--f-slab);font-size:.9rem;line-height:1.12;text-transform:uppercase;text-align:center;letter-spacing:.02em;text-wrap:balance;padding:2px 2px 0;overflow-wrap:anywhere}
.loteria .sub{font-size:.72rem;text-align:center;color:var(--stock-muted);line-height:1.3;margin-top:-3px}
.loteria .sub b{color:#1F4FB5;font-weight:700}
/* Detail hero card */
.hero .art.big{aspect-ratio:16/10;max-height:280px;border-radius:12px;border-width:2.5px;box-shadow:4px 5px 0 var(--shadow);margin-bottom:10px}
.hero .art.big svg{inset:8% 20%;width:60%;height:84%}
.hero .art.big .no{font-size:1rem;padding:6px 10px 7px 8px}
.hero h1.rotulo{font-family:var(--f-rotulo);font-size:clamp(2.1rem, 9vw, 2.7rem);line-height:1.05;color:color-mix(in srgb, var(--g), var(--lift) calc(var(--lift-amt) + var(--boost, 0%) * var(--boost-scale)));text-shadow:2px 2px 0 var(--shadow)}
.hero .article{display:block;font-family:var(--f-slab);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-bottom:2px}
.tab[aria-selected="true"]{border-bottom-color:var(--mx-rosa)}
/* Decluttered card: round olla badge, one short line under the name */
.art .olla{position:absolute;right:5px;bottom:5px;width:28px;height:28px;border-radius:50%;background:#1F6B3F;border:2px solid #1D1A17;color:#F7F5EE;display:grid;place-items:center;z-index:1}
.art .olla svg{position:static;width:18px;height:18px;inset:auto}
.mast .counts{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-top:-2px}

.hero .art.big{aspect-ratio:16/10;max-height:270px}
.hero .art.big svg{inset:6% 25%;width:50%;height:88%}
/* Servings */
.porciones{margin-top:18px;display:grid;gap:10px;background:var(--card);border:2px solid var(--line-ink);border-radius:14px;padding:12px 14px;box-shadow:3px 3px 0 var(--shadow)}
.p-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.p-label{font-family:var(--f-slab);font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
.stepper{display:flex;align-items:center;gap:8px}
.stepper output{min-width:7.5em;text-align:center;font-family:var(--f-mono);font-size:.95rem;font-variant-numeric:tabular-nums}
.st{width:44px;height:44px;border-radius:50%;border:2px solid var(--line-ink);background:var(--mx-rosa);color:var(--on-rosa);font-size:1.4rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.st:active{transform:translateY(1px)}
.p-quick{display:flex;gap:8px;flex-wrap:wrap}
.pq{flex:1 1 0;min-width:0;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 10px;font-weight:700;font-size:.85rem;cursor:pointer}
.pq[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.p-note{margin:0;font-size:.82rem;color:var(--muted)}
.p-units{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.p-ulabel{font-family:var(--f-slab);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:2px}
.p-units .pq{flex:1 1 0}
/* Hoy hay… rótulo */
.hoy{--g2:color-mix(in srgb, var(--g) 78%, #fff);display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;gap:12px;margin-top:6px;padding:8px 12px 8px 8px;text-decoration:none;color:var(--stock-ink);background:var(--stock);border:2px solid var(--line-ink);border-radius:12px;box-shadow:3px 3px 0 var(--shadow)}
.hoy-art{width:64px;height:64px;border-radius:8px;border:2px solid var(--line-ink);background:var(--g2);display:block;position:relative;overflow:hidden}
.hoy-art svg{position:absolute;inset:6%;width:88%;height:88%}
.hoy-txt{display:grid;gap:2px;min-width:0}
.hoy-t{font-family:var(--f-rotulo);font-size:1.35rem;line-height:1.1;color:color-mix(in srgb, var(--g), #2A1608 calc(32% + var(--boost, 0%)));text-shadow:1px 1px 0 var(--stock-ink)}
.hoy-w{font-size:.82rem;color:var(--stock-muted)}
.hoy svg{color:var(--stock-muted)}
/* Theme switch beside the papel picado */
.mast-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.theme-btn{width:40px;height:40px;margin-top:6px;border-radius:50%;border:2px solid var(--line-ink);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.theme-btn svg{width:20px;height:20px}
/* La cantada on the recipe's big card */
.hero .art.big .cantada{position:absolute;left:0;right:0;bottom:0;background:var(--stock);border-top:2.5px solid var(--line-ink);color:var(--stock-ink);font-style:italic;font-size:.9rem;text-align:center;padding:6px 10px;line-height:1.3;z-index:1}
.hero .art.big svg{inset:4% 27% 24%;width:46%;height:70%}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 18px);transform:translate(-50%, 20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--f-rotulo);font-size:1.3rem;padding:10px 20px;border-radius:999px;box-shadow:3px 3px 0 var(--mx-rosa);transition:opacity .2s, transform .2s;z-index:20}
.toast.on{opacity:1;transform:translate(-50%, 0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
/* Lotería cards, the way they look on the table: portrait, cream stock, a thin inset frame line,
   the drawing in its own box, the number in the corner and the name across the bottom. */
.deck{gap:16px 14px}
.loteria{padding:9px 9px 7px;border:0;border-radius:8px;gap:5px;box-shadow:0 1px 1px rgba(30,18,8,.22), 0 10px 18px -12px rgba(30,18,8,.6)}
.loteria::before{content:"";position:absolute;inset:4px;border:1.5px solid var(--line-ink);border-radius:5px;pointer-events:none}
.deck .loteria:nth-child(4n+1){transform:rotate(-.6deg)} .deck .loteria:nth-child(4n+2){transform:rotate(.5deg)}
.deck .loteria:nth-child(4n+3){transform:rotate(.3deg)} .deck .loteria:nth-child(4n){transform:rotate(-.4deg)}
.deck .loteria:hover,.deck .loteria:focus-visible{transform:translateY(-3px);box-shadow:0 2px 2px rgba(30,18,8,.22), 0 16px 24px -12px rgba(30,18,8,.6)}
.deck .loteria:active{transform:translateY(1px);box-shadow:0 1px 1px rgba(30,18,8,.25)}
.loteria .art{aspect-ratio:4/5;border-width:2px;border-radius:2px;background:linear-gradient(to bottom, color-mix(in srgb, var(--g) 78%, #fff) 0 72%, color-mix(in srgb, var(--g), #2A1608 22%) 72% 100%)}
.loteria .art::after{content:"";position:absolute;left:0;right:0;top:72%;border-top:2px solid var(--line-ink)}
.loteria .art svg{left:2%;width:96%;height:auto;top:auto;bottom:12%;aspect-ratio:1/1;z-index:1}
.loteria .art .no{background:none;border:0;border-radius:0;padding:5px 0 0 7px;font-family:var(--f-display);font-size:1.1rem;line-height:1}
.loteria .nm{font-size:.84rem;letter-spacing:.04em;min-height:2.5em;display:flex;align-items:center;justify-content:center;padding:3px 3px 1px}
.loteria .sub{display:none}
.loteria .nm.long{font-size:.74rem;letter-spacing:.02em}
.art .olla{width:24px;height:24px;right:4px;bottom:4px;border-width:1.5px}
.art .olla svg{width:15px;height:15px}
.hero-card{display:grid;place-items:center;padding:4px 0 2px}
.loteria.big{width:min(240px, 64%);transform:rotate(-1.5deg)}
.loteria.big .nm{font-size:1rem;min-height:2.6em}
.loteria.big .art .no{font-size:1.4rem;padding:6px 0 0 9px}
.cantada-line{margin:6px auto 4px;max-width:30ch;text-align:center;font-style:italic;color:var(--muted)}
/* ¿Qué tengo? */
.qt-lede{color:var(--muted);margin:0}
.qt-box{display:grid;gap:10px;margin-top:16px}
.qt-search{display:flex;align-items:center;gap:8px}
.qt-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted)}
.qt-search input{flex:1;min-width:0}
.qt-add{flex:none;min-height:44px;border:2px solid var(--line-ink);background:var(--mx-rosa);color:var(--on-rosa);font-weight:700;border-radius:12px;padding:10px 14px;cursor:pointer}
.qt-hint{margin:-4px 0 0;font-size:.82rem;color:var(--muted)}
.qt-sugg{display:flex;flex-wrap:wrap;gap:6px}
.qt-s{border:1.5px dashed var(--line-ink);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.qt-chips{display:flex;flex-wrap:wrap;gap:6px}
.qt-chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line-ink);background:var(--stock);color:var(--stock-ink);border-radius:999px;padding:6px 10px 6px 12px;font-weight:700;font-size:.9rem;cursor:pointer}
.qt-chip span[aria-hidden]{font-size:1.1rem;line-height:1;color:var(--stock-muted)}
.qt-chip .en,.qt-pick .en,.qt-s .en,.qt-miss .en{font-weight:400;color:var(--muted);font-size:.85em}
.qt-chip .en{color:var(--stock-muted)}
.qt-clear{border:0;background:none;color:var(--talavera);font-weight:700;cursor:pointer;padding:6px}
.qt-unknown{margin:0;font-size:.85rem;color:var(--chile)}
.qt-basics{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}
.qt-basics input{width:20px;height:20px;accent-color:var(--nopal)}
.qt-sec{display:grid;gap:10px;margin-top:26px}
.qt-sec h2.rotulo{font-size:1.6rem;color:var(--ink)}
.qt-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px}
.qt-row:hover{border-color:var(--line-ink)}
.qt-art{width:64px;height:76px;border-radius:6px;border:2px solid var(--line-ink);background:color-mix(in srgb, var(--g) 78%, #fff);position:relative;overflow:hidden}
.qt-art svg{position:absolute;inset:8%;width:84%;height:84%}
.qt-main{display:grid;gap:3px;min-width:0}
.qt-nm{font-family:var(--f-slab);text-transform:uppercase;letter-spacing:.03em;font-size:.88rem}
.qt-meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.qt-meter i{display:block;height:100%;background:var(--nopal);border-radius:3px}
.qt-have{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.qt-miss{font-size:.85rem}
.qt-miss.ok{color:var(--nopal);font-weight:700}
.qt-picks{margin-top:28px;padding-top:6px;border-top:1px dashed var(--line)}
.qt-pickrow{display:flex;flex-wrap:wrap;gap:6px}
.qt-pick{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;color:var(--ink)}
.qt-pick[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qt-pick[aria-pressed="true"] .en{color:var(--paper);opacity:.75}
.qt-season{margin-top:16px}
.qt-season summary{cursor:pointer;font-weight:700;padding:6px 0}
.qt-season summary span{font-weight:400;color:var(--muted)}
.qt-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
/* Comfortable tap targets */
.chip,.pq,.qt-pick,.qt-chip,.qt-s,.qt-clear,.reset,.tab{min-height:44px}
.chip,.qt-pick,.qt-s{display:inline-flex;align-items:center}
/* Milagro (sacred heart) save button */
.icon-btn.fav svg{width:24px;height:24px}
.icon-btn[aria-pressed="true"].fav{border-color:var(--chile);background:var(--chile-soft)}
/* Bottom nav with custom folk icons */
.nav a svg{width:26px;height:26px}
.nav a[aria-current="page"]{color:var(--mx-rosa)}
.nav a[aria-current="page"] svg{transform:translateY(-1px)}
.chilec .top .ico{width:26px;height:26px;flex:none}
.chilec .top{align-items:center}
.chilec .top .nm{flex:1}

<script>
(function(){
const PICADO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 68"><path fill-rule="evenodd" d="M0 0H60V60L52.5 68L45 60L37.5 68L30 60L22.5 68L15 60L7.5 68L0 60Z M21 27a9 9 0 1 0 18 0a9 9 0 1 0 -18 0Z M12 8l5 6-5 6-5-6Z M48 8l5 6-5 6-5-6Z M12 34l5 6-5 6-5-6Z M48 34l5 6-5 6-5-6Z M30 42l4 4.5-4 4.5-4-4.5Z M30 5l3 3.5-3 3.5-3-3.5Z"/></svg>';
document.documentElement.style.setProperty('--picado', 'url("data:image/svg+xml,' + encodeURIComponent(PICADO) + '")');

const CATS = [
  ["desayunos","Desayunos"],["caldos","Caldos y Pozoles"],["guisos","Guisos y Carnes"],["mariscos","Mariscos"],["moles","Moles"],["masa","Masa y Tortilla"],
  ["frijoles","Frijoles y Arroz"],["salsas","Salsas"],["bebidas","Bebidas"],["pan","Panadería"],["postres","Postres"]
];

const R = [
/* ---------------- CALDOS Y POZOLES ---------------- */
{id:"pozole-rojo", name:"Pozole Rojo", en:"Red pork & hominy stew", cat:"caldos", region:"Jalisco", time:"4 h", yield:"10 personas",
 story:"Pozole goes back to pre-Hispanic Mexico, when cacahuazintle corn was cooked for ceremonies. In Jalisco it's red with guajillo and ancho, made with pork head or a mix of shoulder and bony cuts. It's what you make for 15 de septiembre, Nochebuena and New Year's. The broth should be brick red and thin, never a thick chili, and the garnish happens at the table.",
 ing:[["La carne",["2 lb pork shoulder (espaldilla), in 3-inch chunks","2 lb pork neck bones or spine (espinazo)","2 pig's feet (manitas), split, optional but they give body","1 white onion, halved","1 head garlic, halved crosswise","5 quarts water","1 tbsp salt, plus more al gusto"]],
      ["El maíz",["2 lb precooked cacahuazintle hominy (maíz pozolero, sold in bags at Mexican markets), rinsed, or 2 cans (29 oz each) hominy, drained and rinsed"]],
      ["El chile",["6 chiles guajillo","3 chiles ancho","1–2 chiles de árbol, optional, for heat","4 garlic cloves","¼ white onion","1 tsp Mexican oregano","Pinch of cumin, only if your family uses it"]],
      ["Para servir",["Finely shredded green cabbage, or lettuce as many tapatíos prefer","Sliced radishes","Finely chopped white onion","Dried Mexican oregano","Ground chile piquín","Limes, in wedges","Tostadas"]]],
 steps:["Put the meats, onion and garlic in your biggest pot with the water. Bring to a boil and skim the gray foam for the first 15 minutes so the broth stays clean.",
  "If using bagged hominy, add it now. Lower to a gentle simmer, partly covered, and cook 2 to 2½ hours, until the meat is very tender and the kernels have opened like flowers (revienta). Add the salt only once the corn has bloomed; salting early keeps it hard.",
  "Meanwhile, stem and seed the chiles. Toast them on a hot comal 10–20 seconds per side, just until fragrant and pliable. Cover with hot water and soak 15 minutes.",
  "Blend the chiles with the garlic, onion, oregano, cumin (if using) and [[1½ cups]] of the pork broth until completely smooth. Pour through a fine strainer, pressing with a spoon. Discard the skins.",
  "Lift out the meat. Shred or cut it into bite-size pieces, pick the meat off the bones and feet, and return it to the pot. Discard bones, onion and garlic.",
  "If using canned hominy, add it now. Stir in the strained chile and simmer 30 minutes. Season well with salt. It should be red and brothy, not thick.",
  "Serve in deep bowls. Everyone garnishes their own: cabbage, radish, onion, oregano rubbed between the palms, chile piquín and a good squeeze of lime. Tostadas on the side."],
 pc:{time:"45 min high pressure + 20 min natural release", total:"1 h 45",
  steps:["Toast, soak, blend and strain the chiles exactly as in the traditional method.",
   "Put the meats, onion and garlic in the pot. Add bagged hominy now if using. Add water to the max-fill line (about 3½ quarts in an 8-qt pot; use about two-thirds of the meat in a 6-qt).",
   "Seal and cook at high pressure 45 minutes (55 if using pig's feet). Let the pressure release naturally for 20 minutes, then vent.",
   "Remove the meat, shred it, discard the bones and aromatics, and return the meat.",
   "Switch to Sauté. Add the strained chile, canned hominy if using, and the salt (salt after the corn has bloomed). Simmer uncovered 20–30 minutes. Taste and serve."],
  note:"Plenty of abuelas already make pozole in a stovetop olla exprés. Count about 35 minutes from when the valve starts to rock."},
 tips:["Strain the chile. The skins make the broth gritty and bitter.","Toast chiles until you smell them, only seconds. If they smoke, they'll taste bitter: throw them out and start over.","Pozole is better the next day. Chill it and lift off the fat if you like.","A weeknight version most families accept: bone-in chicken thighs instead of pork, about 1 hour on the stove."],
 vars:[
  {name:"Pozole Verde", en:"Green pozole with pumpkin seeds", region:"Guerrero",
   note:"Thursdays in Guerrero are jueves pozolero. The green comes from pepitas, tomatillo and fresh herbs. The table gets chicharrón and avocado and, depending on the region, a raw egg cracked into the hot broth or sardines, with mezcal on the side.",
   ing:["Pork and hominy from the base recipe (or 1 whole chicken)","1 cup raw hulled pepitas","1 lb tomatillos, husked","2–3 serranos or jalapeños","½ white onion","3 garlic cloves","2 hoja santa leaves (or 1 tsp anise seed)","1 large sprig epazote","½ bunch cilantro","4 romaine or radish leaves","2 tbsp lard","To serve: chicharrón, avocado, onion, oregano, lime, tostadas"],
   steps:["Cook the meat and hominy as in the base recipe, steps 1, 2 and 5 (add canned hominy now if using). Leave out the red chile.","Toast the pepitas in a dry pan, stirring, until they puff and pop but don't brown. Let cool.","Simmer the tomatillos and chiles in water 8 minutes, until olive green. Drain.","Blend the pepitas, tomatillos, chiles, onion, garlic, hoja santa, epazote, cilantro and romaine or radish leaves with [[2 cups]] broth until very smooth.","Heat the lard in a skillet and fry the green sauce 5 minutes, stirring.","Stir it into the pot and keep at a bare simmer 15 minutes. A hard boil makes the pepita sauce split.","Serve with the garnishes."],
   pc:"Same pressure times for the meat. Add the green sauce on Sauté-Low and don't let it boil."},
  {name:"Pozole Blanco", en:"White pozole", region:"Guerrero · Michoacán",
   note:"The oldest style: pork, corn and salt in the broth, nothing else. All the chile is served on the side so each bowl is seasoned at the table.",
   ing:["Everything from the base recipe except the red chile","For the salsa: 10 chiles de árbol","2 chiles guajillo","2 garlic cloves","½ tsp salt","¾ cup water"],
   steps:["Cook the meat and hominy as in the base, steps 1, 2 and 5 (add canned hominy now if using). Skip the chile.","For the salsa, toast the chiles a few seconds, soak 10 minutes, blend with garlic, salt and water, and strain.","Serve the white broth with the salsa, onion, oregano, lime, cabbage and radish on the table."],
   pc:"Same pressure times as the base recipe."}
 ]},

{id:"menudo-rojo", name:"Menudo Rojo", en:"Red tripe & hominy soup", cat:"caldos", region:"Chihuahua · Norte", time:"5 h", yield:"8 personas",
 story:"Sunday morning menudo, el levantamuertos, is the norteño cure for a long Saturday night. In central Mexico the same soup is pancita, and in Yucatán mondongo. The tripe is cleaned with lime and cooked slowly with pata de res, the beef foot that makes the broth sticky. Families start it on Saturday so it's ready for breakfast.",
 ing:[["La carne",["4 lb beef honeycomb tripe (panal)","2 lb beef foot (pata de res), cut in pieces by the butcher","2 limes or ¼ cup white vinegar, plus a handful of coarse salt, for cleaning","1 white onion, halved","1 head garlic, halved","6 quarts water","2 tbsp salt"]],
      ["El chile",["8 chiles guajillo","2 chiles ancho","3 garlic cloves","1 tsp Mexican oregano","½ tsp cumin seed"]],
      ["El maíz",["1 can (29 oz) hominy, drained and rinsed"]],
      ["Para servir",["Chopped white onion","Mexican oregano","Crushed chile piquín or chiltepín","Limes","Warm corn tortillas or bolillos"]]],
 steps:["Clean the tripe: rinse it, rub it all over with lime halves (or vinegar) and a handful of salt, and rinse again under cold water. Trim excess fat and cut into 1½-inch squares.",
  "Put the beef foot, tripe, onion and garlic in a large pot with the water. Bring to a boil and skim for 15 minutes.",
  "Lower to a gentle simmer, partly covered, and cook 3½–4 hours. The tripe is ready when it's tender with a little chew and the beef foot is soft and gelatinous. Add hot water if it reduces too much.",
  "Toast, soak and blend the chiles with the garlic, oregano, cumin and [[1½ cups]] broth. Strain into the pot.",
  "Add the hominy and salt. Simmer 30 minutes more. Pick the meat off the foot bones if you like, and discard the bones and aromatics.",
  "Serve very hot with onion, oregano, chile piquín, lime and tortillas."],
 pc:{time:"60 min high pressure + 20 min natural release", total:"1 h 45",
  steps:["Clean and cut the tripe as in step 1.","Put the tripe, beef foot, onion, garlic and salt in the pot. Add water to the max-fill line.","Meanwhile, toast, soak, blend and strain the chiles as in step 4.","High pressure 60 minutes. Natural release 20 minutes. If the tripe is still tough, seal again for 15 minutes.","Add the strained chile and the hominy. Simmer on Sauté 20 minutes."],
  note:"Tripe varies a lot. Pre-cooked white tripe from the store needs only about 30 minutes."},
 tips:["The pata is what makes your lips stick together. Don't skip it.","Lime and salt take away the barnyard smell. Rinse until the water runs clear.","Make it a day ahead. The fat sets on top and lifts right off."],
 vars:[{name:"Menudo Blanco", en:"White menudo", region:"Sonora",
  note:"In Sonora and Sinaloa menudo is white by default: no chile in the pot, and the heat comes from crushed chiltepín at the table, with buttered birote or bolillo.",
  ing:["Everything from the base recipe except the chile","Chiltepín, crushed between your fingers","Chopped cilantro and onion"],
  steps:["Cook the tripe and beef foot as in the base, steps 1–3.","Add the hominy and salt and simmer 30 minutes.","Serve with chiltepín, oregano, onion, cilantro and lime."],
  pc:"Same pressure time as the base."}]},

{id:"caldo-de-res", name:"Caldo de Res", en:"Beef & vegetable soup", cat:"caldos", region:"Centro · Norte", time:"3 h", yield:"8 personas",
 story:"The everyday soup of every Mexican home: beef shank with the bone and marrow, corn on the cob and whatever vegetables the market has. The rice goes in the bowl, not the pot.",
 ing:[["La carne",["3 lb beef shank (chambarete), bone-in with marrow","1 lb beef short ribs (costilla de res), optional","½ white onion","4 garlic cloves","4 quarts water","1 tbsp salt"]],
      ["Las verduras",["2 Roma tomatoes","3 ears of corn, each cut in 3 rounds","3 carrots, in thick pieces","2 medium potatoes, quartered","1 chayote, peeled and cut in wedges","2 Mexican zucchini (calabacitas), in thick pieces","¼ green cabbage, in wedges","Handful of cilantro sprigs","1 sprig hierbabuena (mint)"]],
      ["Para servir",["Arroz rojo","Limes","Chopped onion and cilantro","Sliced serranos or salsa","Corn tortillas"]]],
 steps:["Put the meat, onion and garlic in a big pot with the water. Bring to a boil and skim the foam for 15 minutes.",
  "Add the salt, lower the heat and simmer partly covered 2 hours, until the meat is tender.",
  "Blend the tomatoes with a cup of broth and strain into the pot. It gives the caldo a light color.",
  "Add the vegetables by how long they take: corn and carrots first, 15 minutes; then potatoes and chayote, 10 minutes; then zucchini and cabbage, 8 minutes.",
  "Turn off the heat and drop in the cilantro and mint. Taste for salt.",
  "Put a spoon of arroz rojo in each bowl, add meat and vegetables, and ladle the broth over. Lime and chile at the table."],
 pc:{time:"40 min high pressure + 15 min natural release", total:"1 h 10",
  steps:["Put the meat, onion, garlic, salt and [[3 quarts]] water in the pot. High pressure 40 minutes, natural release 15.","Add the strained tomato, corn, carrots, potatoes and chayote. High pressure 3 minutes, quick release.","Switch to Sauté, add the zucchini and cabbage, and simmer 5 minutes. Add the cilantro and mint off the heat."]},
 tips:["Scoop the marrow out of the bone onto a hot tortilla with salt and salsa. That's the cook's reward.","Mint is the quiet secret in a lot of family caldos. One sprig is enough."],
 vars:[{name:"Mole de Olla", en:"Chile-red beef soup with xoconostle", region:"Ciudad de México · Centro",
  note:"Caldo de res's spicier cousin. The broth is tinted with dried chiles and soured with xoconostle, a tart cactus fruit. Many central families drop in chochoyotes, little masa-and-epazote dumplings pressed with a thumb, for the last 10 minutes. The saying «¡A darle, que es mole de olla!» means let's get to it.",
  ing:["Meat and broth from the base, steps 1–2","4 chiles guajillo, 2 chiles pasilla (1 ancho, optional)","2 Roma tomatoes, 2 garlic cloves, ¼ onion","1 tbsp lard","2 xoconostles, peeled, seeded and quartered (or the juice of 1 lime at the end)","2 ears of corn","½ lb green beans","2 zucchini","1 chayote","2 potatoes","2 sprigs epazote"],
  steps:["Cook the meat as in the base.","Toast and soak the chiles. Blend with the tomatoes, garlic and onion, strain, and fry in the lard 5 minutes.","Add the chile to the broth with the corn, potatoes, chayote and xoconostle. Cook 15 minutes.","Add the green beans, zucchini and epazote and cook 8 minutes more.","Serve with chopped onion, serrano and lime."],
  pc:"Same pressure steps as the base. Add the fried chile with the first batch of vegetables."}]},

{id:"caldo-de-pollo", name:"Caldo de Pollo", en:"Chicken soup", cat:"caldos", region:"Toda la República", time:"1 h 15", yield:"6 personas",
 story:"The soup for colds, for heartbreak and for Sundays. Abuela used a gallina, an old laying hen with more flavor than a young chicken. The broth should be clear and golden.",
 ing:[["El caldo",["1 whole chicken (or stewing hen), cut in pieces, skin on","½ white onion","3 garlic cloves","1 Roma tomato","1 celery stalk, optional","3 quarts water","2 tsp salt"]],
      ["Las verduras",["2 carrots, in rounds","2 potatoes, in chunks","1 chayote, in wedges","2 zucchini, in chunks","½ cup cooked chickpeas, optional","Handful of cilantro"]],
      ["Para servir",["Limes, chopped onion and cilantro, serrano","Diced avocado","Arroz rojo or white rice"]]],
 steps:["Put the chicken, onion, garlic, tomato and celery in a pot with the water. Bring to a boil and skim well.",
  "Add the salt and simmer gently 40 minutes (1½–2 hours for a hen). Keep it at a lazy bubble so the broth stays clear.",
  "Remove the tomato and onion. Add the carrots and potatoes and cook 10 minutes. Add the chayote, zucchini and chickpeas and cook 8 minutes.",
  "Add the cilantro off the heat. Serve with lime, onion, chile, avocado and rice."],
 pc:{time:"15 min high pressure + 10 min natural release", total:"35 min",
  steps:["Put the chicken, aromatics, salt and [[2½ quarts]] water in the pot. High pressure 15 minutes (30 for a hen), natural release 10.","Remove the aromatics. Add the carrots, potatoes and chayote. High pressure 2 minutes, quick release.","On Sauté, add the zucchini and chickpeas for 4 minutes. Finish with cilantro."]},
 tips:["Once the foam is skimmed, never let it boil hard or the broth turns cloudy.","Add a handful of rice or fideo to the pot for a heartier soup."],
 vars:[{name:"Caldo Tlalpeño", en:"Smoky chipotle chicken soup", region:"Tlalpan, Ciudad de México",
  note:"A chipotle chicken soup named for Tlalpan, in the south of the capital. Local legend says it was made for Santa Anna as a hangover cure, and Tlalpan still holds a Festival del Caldo Tlalpeño.",
  ing:["Broth and shredded chicken from the base","2 chipotles en adobo (or 2 dried chipotles, toasted and soaked)","2 Roma tomatoes, ¼ onion, 1 garlic clove","1 tbsp oil","1 cup cooked chickpeas","2 carrots, diced, and ½ lb green beans, cut","2 sprigs epazote","To serve: avocado, cubes of queso panela or Oaxaca, lime"],
  steps:["Shred the chicken from the base, discarding the skin and bones. Blend the tomatoes, onion, garlic and chipotle with a cup of broth and fry in the oil 5 minutes.","Add to the broth with the carrots and chickpeas and simmer 10 minutes.","Add the green beans, epazote and shredded chicken and simmer 5 minutes.","Serve over cubes of cheese and avocado, with lime."],
  pc:"Use the base pressure steps and add the chipotle sauce with the carrots."}]},

{id:"sopa-de-fideo", name:"Sopa de Fideo", en:"Toasted noodle soup in tomato broth", cat:"caldos", region:"Toda la República", time:"30 min", yield:"6 personas",
 story:"The first soup most Mexican kids learn to love. Everything depends on toasting the noodles to the color of a peanut shell before the tomato goes in.",
 ing:[["Sopa",["7 oz fideo (thin coiled vermicelli)","3 tbsp oil or lard","3 Roma tomatoes","¼ white onion","1 garlic clove","6 cups hot chicken broth","1 tsp salt, or al gusto","1 sprig cilantro (or a few leaves of epazote)"]],
      ["Para servir",["Limes","Crema and crumbled queso fresco","Chopped chipotles en adobo, optional"]]],
 steps:["Blend the tomatoes, onion and garlic with [[1 cup]] of the broth until smooth.",
  "Heat the oil in a pot over medium. Add the fideo, breaking up the coils, and stir constantly until deep golden. Don't walk away; it burns fast.",
  "Pour the tomato purée through a strainer into the pot. It will sizzle. Fry, stirring, 3 minutes until it darkens.",
  "Add the rest of the broth, the salt and the cilantro. Simmer 8–10 minutes, until the fideo is soft.",
  "Serve with lime, and crema and queso if you like."],
 pc:null, pcNote:"No pressure-cooker version. This soup is done in 30 minutes on the stove, and the noodles would turn to mush.",
 tips:["If the fideo browns too fast, pull the pot off the heat. It keeps cooking in the hot oil."],
 vars:[{name:"Sopa Seca de Fideo", en:"Dry fideo with chipotle", region:"Centro",
  note:"A dry soup, cooked until the noodles absorb all the broth. It's the second tiempo of a comida corrida: sopa aguada, then sopa seca, then the guisado.",
  ing:["Same as the base, but only 3 cups broth (1 for the purée, 2 to cook)","1–2 chipotles en adobo, blended with the tomato","Crema, queso fresco and avocado"],
  steps:["Toast the fideo and fry the tomato-chipotle purée as in the base.","Add [[2 cups]] broth, cover and cook on low 10 minutes until absorbed.","Top with crema, queso and avocado."]}]},

{id:"albondigas", name:"Albóndigas en Caldillo", en:"Meatball soup with mint", cat:"caldos", region:"Norte · Centro", time:"1 h", yield:"6 personas",
 story:"Mexican meatballs carry raw rice inside, which swells as they cook and keeps them tender, and fresh mint, which is the flavor everyone remembers.",
 ing:[["Albóndigas",["1 lb ground beef","½ lb ground pork","¼ cup long-grain rice, soaked 15 minutes in hot water and drained","1 egg","2 tbsp finely chopped hierbabuena (mint)","2 tbsp finely chopped onion","1 garlic clove, minced","½ tsp ground cumin","1 tsp salt and ¼ tsp black pepper"]],
      ["Caldillo",["4 Roma tomatoes","¼ white onion","2 garlic cloves","1–2 chipotles en adobo, optional","1 tbsp oil","8 cups beef or chicken broth (or water)","2 carrots, diced","1 potato, diced","1 zucchini, diced","1 sprig hierbabuena","Salt, al gusto"]],["Para servir",["Corn tortillas","Limes"]]],
 steps:["Mix all the albóndiga ingredients with your hands just until combined. Wet your hands and roll balls the size of a golf ball.",
  "Blend the tomatoes, onion, garlic and chipotle. Heat the oil in a wide pot and fry the purée 5 minutes, until it darkens.",
  "Add the broth and the mint sprig. Bring to a boil and add the carrots and potato.",
  "Lower in the meatballs one at a time. Don't stir for the first 10 minutes so they can set.",
  "Simmer 25–30 minutes, adding the zucchini for the last 10. Taste for salt.",
  "Serve with tortillas and lime."],
 pc:{time:"8 min high pressure + 10 min natural release", total:"30 min",
  steps:["On Sauté, fry the tomato purée 5 minutes.","Add the broth, mint, carrots and potato. Gently set in the meatballs.","High pressure 8 minutes, natural release 10.","Add the zucchini and simmer on Sauté 3 minutes."]},
 tips:["Some families tuck a piece of hard-boiled egg inside each meatball. Kids love finding it.","Keep your hands wet while rolling and the meat won't stick."],
 vars:[]},

/* ---------------- GUISOS Y CARNES ---------------- */
{id:"birria-de-chivo", name:"Birria de Chivo", en:"Goat in chile adobo with consomé", cat:"guisos", region:"Jalisco", time:"5 h + overnight", yield:"10 personas",
 story:"Birria comes from Jalisco, where goat was cooked in a pit or in a pot sealed shut with masa. The adobo is dried chiles, vinegar and warm spices, and the meat is served in a bowl of its own consomé. 'Birria' means something worthless: popular history says the Spaniards scorned goat, and Jalisco (Cocula claims the honor) turned it into a feast.",
 ing:[["La carne",["5 lb bone-in goat (or lamb shoulder, or a mix of beef chuck and short rib)","1 tbsp salt"]],
      ["El adobo",["8 chiles guajillo","4 chiles ancho","2–4 chiles de árbol, optional","½ cup apple cider vinegar","6 garlic cloves","½ white onion","1 tsp Mexican oregano","½ tsp cumin seed","4 whole cloves","½ tsp black peppercorns","1-inch stick Mexican cinnamon (canela)","½-inch piece fresh ginger","½ tsp dried thyme","½ tsp dried marjoram (mejorana)"]],
      ["El consomé",["2 Roma tomatoes, charred","3 bay leaves","2 cups water, plus more for the consomé (about 6 cups in all)"]],
      ["Para servir",["Chopped onion and cilantro","Mexican oregano","Limes","Salsa de chile de árbol","Corn tortillas"]]],
 steps:["Stem and seed the chiles. Toast them on a comal a few seconds per side and soak in hot water 15 minutes.",
  "Toast the cumin, cloves, peppercorns and cinnamon in a dry pan for 30 seconds.",
  "Blend the chiles with the vinegar, spices, garlic, onion, oregano, ginger, thyme, marjoram and salt, adding just enough soaking water to make a thick paste.",
  "Rub the paste all over the meat. Cover and refrigerate overnight, or at least 4 hours.",
  "Put a rack in a large Dutch oven with [[2 cups]] water and the bay leaves underneath. Set the meat on the rack and scrape in all the adobo. Cover with foil and then the lid, sealing as tightly as you can. That's the home version of sealing the pot with masa.",
  "Cook in a 325°F oven 3½–4 hours, until the meat falls off the bone.",
  "Lift out the meat. Skim the red fat from the juices and save it. Blend the charred tomatoes with some of the juices, add them back, add water to make about [[6 cups]] of consomé, and simmer 10 minutes. Season.",
  "Serve the meat in bowls with hot consomé, onion, cilantro, oregano, lime, salsa and tortillas."],
 pc:{time:"50 min high pressure + 20 min natural release", total:"1 h 30 + overnight",
  steps:["Make the adobo and marinate as in steps 1–4.","Put the meat, all the adobo, the bay leaves and [[2 cups]] water in the pot.","High pressure 50 minutes for goat or lamb, 60 for beef chuck. Natural release 20 minutes.","Lift out the meat. Skim and save the fat. Blend in the tomatoes and simmer the consomé on Sauté 10 minutes."],
  note:"Don't skip the overnight marinade. The pressure cooker saves cooking time, not flavor time."},
 tips:["Save the red fat from the top of the consomé to fry tortillas for tacos.","The vinegar matters. It cuts the richness and helps tenderize the meat.","Birria tatemada: brown the drained meat in a hot oven or on the comal for roasted edges before serving."],
 vars:[{name:"Birria de Res estilo Tijuana", en:"Beef birria quesatacos", region:"Tijuana, Baja California",
  note:"The version that took over social media: the same adobo with beef, and tacos crisped in the red fat with melted cheese, dipped in consomé. Not the abuela original, but nobody complains.",
  ing:["Adobo and consomé from the base","2 lb beef chuck, 2 lb short ribs, 1 lb oxtail","Queso Oaxaca or mozzarella, shredded","Corn tortillas","Chopped onion and cilantro"],
  steps:["Marinate and cook the beef as in the base (4 hours in the oven or 60 minutes under pressure).","Shred the meat and keep the consomé hot.","Dip a tortilla in the red fat, lay it on a hot griddle, add cheese and meat, fold, and cook until crisp on both sides.","Serve with a cup of consomé topped with onion and cilantro for dipping."],
  pc:"High pressure 60 minutes, natural release 20."}]},

{id:"cochinita-pibil", name:"Cochinita Pibil", en:"Achiote pork in banana leaf", cat:"guisos", region:"Yucatán", time:"4 h + overnight", yield:"8 personas",
 story:"Pibil means cooked in the pib, the Maya earth oven. Pork marinates in achiote and sour orange, then cooks wrapped in banana leaves until it falls apart. In Mérida it's breakfast, eaten in tacos and tortas.",
 ing:[["La carne",["4 lb pork shoulder, in 3-inch chunks","1 lb banana leaves (frozen are fine)","2 tbsp lard, optional"]],
      ["El recado",["3½ oz achiote paste (recado rojo)","1 cup naranja agria (sour orange) juice, or ⅔ cup orange juice plus ⅓ cup lime juice","4 garlic cloves","1 tsp salt","½ tsp Mexican oregano","¼ tsp ground cumin","¼ tsp ground allspice","¼ tsp black pepper"]],
      ["Para servir",["Cebolla morada encurtida (see Variantes)","Xnipec or another habanero salsa","Corn tortillas or bolillos"]]],
 steps:["Blend the achiote with the juice, garlic, salt and spices until smooth.",
  "Coat the pork with it and marinate overnight, covered, in the fridge.",
  "Pass the banana leaves quickly over a flame or burner until they turn shiny and soft. Line a Dutch oven or deep baking dish with them, letting them hang over the sides.",
  "Add the pork and all the marinade, dot with the lard, and fold the leaves over to close the package. Cover with foil and the lid.",
  "Bake at 325°F for 3½–4 hours, until the pork pulls apart with a fork.",
  "Open the leaves and shred the pork in its juices. Serve with pickled onion and habanero salsa."],
 pc:{time:"50 min high pressure + 20 min natural release", total:"1 h 15 + overnight",
  steps:["Marinate the pork overnight.","Line the pot with softened banana leaves. Add the pork, the marinade and ½ cup water, and fold the leaves over.","High pressure 50 minutes, natural release 20.","Shred the pork. If the juices are thin, lift out the meat and reduce them on Sauté 5 minutes."]},
 tips:["Seville oranges (naranja agria) are the real thing. Latin markets sell the juice bottled if you can't find fresh.","For tortas de cochinita, split a bolillo and fill it with pork, onions and a spoon of the juices. That's breakfast in Mérida."],
 vars:[
  {name:"Cebolla Morada Encurtida", en:"Pickled red onion with habanero", region:"Yucatán",
   note:"Always on the table with cochinita.",
   ing:["2 red onions, thinly sliced","1 habanero, thinly sliced (seeds out for less heat)","½ cup naranja agria or lime juice","½ tsp salt","¼ tsp Mexican oregano"],
   steps:["Pour boiling water over the onions, wait 10 seconds and drain. It softens the bite and turns them bright pink.","Toss with the habanero, juice, salt and oregano.","Let stand at least 1 hour. Keeps a week in the fridge."]},
  {name:"Xnipec", en:"Yucatecan habanero salsa", region:"Yucatán",
   note:"Its Maya name means dog's nose, because it's spicy enough to make your nose wet.",
   ing:["2 tomatoes, finely diced","½ red onion, finely diced","1–2 habaneros, minced","¼ cup chopped cilantro","2 sour oranges or limes, juiced","Salt, al gusto"],
   steps:["Mix everything and let it sit 15 minutes before serving."]}
 ]},

{id:"carnitas", name:"Carnitas", en:"Pork simmered in lard", cat:"guisos", region:"Michoacán", time:"3 h", yield:"10 personas",
 story:"In Quiroga, Michoacán, the carnitas capital, they're made in big copper cazos from Santa Clara del Cobre, the pork simmering in lard until it's tender inside and crisp outside. Orange and a splash of milk or Coke help it brown. It's party food for weekends, baptisms and birthdays.",
 ing:[["Carnitas",["5 lb pork shoulder, in 3-inch chunks (add some ribs or skin if you can)","2 lb lard (manteca), enough to almost cover","1 tbsp salt","1 orange, halved","½ cup whole milk or Mexican Coca-Cola, optional","4 garlic cloves, optional","2 bay leaves, optional","½ tsp Mexican oregano, optional"]],
      ["Para servir",["Corn tortillas","Salsa verde","Chopped onion and cilantro","Limes","Pickled jalapeños"]]],
 steps:["Melt the lard in a heavy pot (cast iron or Dutch oven) over medium heat.",
  "Add the pork, the salt, and the garlic and herbs if using. The lard should bubble gently, not fry hard. Cook 2 hours, stirring now and then, until the meat is tender.",
  "Squeeze in the orange and drop in the halves. Add the milk or Coke. Cook 15 minutes.",
  "Raise the heat to medium-high for the last 15–20 minutes so the pork turns golden brown and crisp at the edges. Watch for splatter.",
  "Lift out with a slotted spoon and drain. Chop and serve with tortillas, salsa, onion, cilantro and lime.",
  "Strain the lard when it cools and keep it in the fridge. It's gold for beans and tamales."],
 pc:{time:"40 min high pressure + 15 min natural release, then broil", total:"1 h 10",
  steps:["Put the pork, salt, orange juice and halves, garlic, bay leaves, ½ cup water and [[3 tbsp]] lard in the pot.","High pressure 40 minutes, natural release 15.","Spread the meat on a sheet pan, break it into chunks, and drizzle with a few spoons of the fat and juices.","Broil 5–8 minutes until the edges crisp, or fry in batches in a hot cast-iron pan with lard."]},
 tips:["Ask the carnicero for carnitas surtidas: maciza (lean), cuerito (skin), costilla (rib) and buche (stomach).","Don't stir much at first. Let the pork confit quietly.","Purists use only lard, salt and time. Orange, milk and Coca-Cola are carnitero tricks for color, and every one has his own fórmula. If you use Coke, make it the cane-sugar Mexican one."],
 vars:[]},

{id:"barbacoa", name:"Barbacoa de Res", en:"Slow-steamed beef cheeks", cat:"guisos", region:"Norte · Hidalgo", time:"6 h", yield:"8 personas",
 story:"In Hidalgo, barbacoa is lamb wrapped in maguey leaves and cooked overnight in a pit, with a pot underneath catching the juices for consomé. This home version steams beef with avocado leaves. Barbacoa is el almuerzo dominguero: in the north, families buy cachete, lengua and cabeza by the kilo on Sunday mornings.",
 ing:[["La carne",["3 lb beef cheeks (cachete), or chuck roast in large pieces","1 tbsp salt","1 tsp black pepper","1 tsp ground cumin","6 garlic cloves, mashed","1 white onion, quartered","3 bay leaves","6 dried avocado leaves, toasted (or 1 tsp anise seed)","4 cups water, for steaming","Banana leaves, optional, for wrapping"]],
      ["Consomé",["1 cup cooked chickpeas","¼ cup rice","1 carrot, diced","Chopped onion, cilantro, lime and salsa"]],
      ["Para servir",["Salsa borracha (see Variantes)","Corn tortillas"]]],
 steps:["Rub the meat with the salt, pepper, cumin and garlic. Let stand 1 hour, or overnight in the fridge.",
  "Put a rack or steamer basket in a tall pot with 4 cups water, the onion and the bay leaves underneath.",
  "Lay banana leaves on the rack if you have them, add the avocado leaves and the meat, and fold the banana leaves over.",
  "Cover tightly and steam on low 4–5 hours, adding hot water when needed, until the meat shreds easily.",
  "Shred the meat. For the consomé, strain the liquid from under the rack, add the chickpeas, rice and carrot, and simmer 20 minutes.",
  "Serve the barbacoa in tortillas with salsa, and the consomé in a cup on the side with chopped onion, cilantro and lime."],
 pc:{time:"65 min high pressure + 20 min natural release", total:"1 h 40",
  steps:["Season the meat. Put the onion, bay leaves, avocado leaves and 1½ cups water in the pot and add the meat.","High pressure 65 minutes, natural release 20.","Shred the meat with a little of the liquid.","Strain the remaining liquid, add the chickpeas, rice and carrot, and cook on Sauté 15 minutes for consomé."]},
 tips:["Mexican avocado leaves taste of anise. Toast them a few seconds on the comal before using.","Cheeks are full of collagen. Don't trim them too lean or you'll lose the silky texture."],
 vars:[{name:"Salsa Borracha", en:"Pasilla salsa with beer or pulque", region:"Hidalgo",
  note:"The classic partner for barbacoa, traditionally made with pulque.",
  ing:["6 chiles pasilla","2 garlic cloves","¼ white onion","½ cup pulque or light Mexican beer","Salt, al gusto","Crumbled queso añejo and chopped onion, to finish"],
  steps:["Toast the pasillas briefly and soak 10 minutes.","Grind in the molcajete or blend with the garlic, onion, beer and salt. Keep it a little coarse.","Top with queso añejo and chopped onion."]}]},

{id:"puerco-salsa-verde", name:"Puerco en Salsa Verde", en:"Pork in tomatillo salsa with purslane", cat:"guisos", region:"Centro", time:"1 h 30", yield:"6 personas",
 story:"A weekday guisado. The pork cooks in a little water until the water is gone and it fries in its own fat, and then the salsa goes in. Verdolagas (purslane) add a lemony, juicy bite. Potatoes or nopales are just as common.",
 ing:[["El puerco",["2½ lb pork shoulder or country ribs, in 1½-inch pieces","1 cup water","1 tsp salt","1 tbsp lard"]],
      ["La salsa",["1½ lb tomatillos, husked","3–4 serranos","¼ white onion","2 garlic cloves","½ bunch cilantro","Pinch of cumin, optional","Salt, al gusto"]],
      ["La verdura",["1 lb verdolagas (purslane), thick stems removed, or 3 potatoes, cubed, or 2 cups cooked nopales"]],["Para servir",["Frijoles de la olla","Corn tortillas"]]],
 steps:["Put the pork, water and salt in a wide pan. Cook uncovered over medium, stirring now and then, until the water is gone and the pork browns in its own fat, about 40 minutes. Add the lard if the pork is lean.",
  "Meanwhile, simmer the tomatillos and serranos in water 8 minutes, until they turn olive green. Drain.",
  "Blend them with the onion, garlic, cilantro and cumin.",
  "Pour the salsa over the pork. It will sizzle. Season and simmer 20 minutes, until slightly thickened. (Potatoes go in now.)",
  "Blanch the verdolagas 1 minute in boiling water, drain, and stir them into the pot for the last 5 minutes (or add the cooked nopales).",
  "Serve with frijoles and tortillas."],
 pc:{time:"20 min high pressure + 10 min natural release", total:"45 min",
  steps:["Brown the pork in the lard on Sauté, in batches.","Blend the raw tomatillos, serranos, onion, garlic and cumin (no need to boil them first). Pour over the pork with ½ cup water. Add potatoes now if using.","High pressure 20 minutes, natural release 10.","Stir in the blanched verdolagas and the cilantro and simmer on Sauté 5 minutes."]},
 tips:["Don't over-boil tomatillos. As soon as they turn from bright to olive green, take them out, or they burst and turn sour.","Purslane grows wild in a lot of gardens. It's free food."],
 vars:[]},

{id:"tinga-de-pollo", name:"Tinga de Pollo", en:"Chipotle shredded chicken", cat:"guisos", region:"Puebla", time:"45 min", yield:"6 personas",
 story:"Tinga is from Puebla: lots of soft onion, tomato and smoky chipotle. It goes on tostadas with beans, crema and queso, and it's what you bring to a fiesta. Tostadas de tinga are on nearly every table at the Noche Mexicana on 15 de septiembre, next to the pozole.",
 ing:[["El pollo",["2 lb chicken thighs or breasts","¼ onion, 2 garlic cloves, 1 bay leaf and salt, for poaching"]],
      ["La salsa",["2 tbsp lard or oil","2 white onions, thinly sliced","2 garlic cloves, minced","1½ lb ripe tomatoes (or 5 Roma)","2–4 chipotles en adobo, plus 1 tbsp of the adobo sauce","½ tsp Mexican oregano","2 bay leaves","Salt, al gusto"]],
      ["Para servir",["Tostadas","Frijoles refritos","Shredded lettuce","Crema, queso fresco and avocado"]]],
 steps:["Simmer the chicken in water with the onion, garlic, bay leaf and salt for 20 minutes. Cool, shred and save [[1 cup]] of the broth.",
  "Blend the tomatoes with the chipotles and adobo sauce.",
  "Heat the lard and cook the sliced onions over medium-low 8 minutes, until soft and translucent but not brown. Add the garlic for 1 minute.",
  "Add the tomato-chipotle purée, oregano and bay leaves. Cook 8 minutes, until it darkens.",
  "Add the chicken and [[½ cup]] of the broth. Simmer 10 minutes until juicy but not soupy. Season.",
  "Spread tostadas with beans, pile on the tinga, and top with lettuce, crema, queso and avocado."],
 pc:{time:"10 min high pressure + 5 min natural release", total:"25 min",
  steps:["On Sauté, soften the onions in the lard, then add the garlic.","Add the purée, oregano, bay leaves and ½ cup water. Nestle in the raw chicken thighs.","High pressure 10 minutes (8 for breasts), natural release 5.","Shred the chicken right in the sauce. Simmer on Sauté a few minutes to thicken."]},
 tips:["Be generous with the onion. Tinga should be half onion.","Start with 2 chipotles and add more after tasting. The heat varies from can to can."],
 vars:[{name:"Tinga Poblana de Puerco", en:"Pork and chorizo tinga", region:"Puebla",
  note:"The oldest printed tingas (La cocinera poblana, 1881) are pork with chorizo and longaniza, sometimes with potato.",
  ing:["2 lb pork shoulder, cooked and shredded","6 oz Mexican chorizo","The same tinga sauce as the base","1 potato, diced and boiled, optional","Avocado, to serve"],
  steps:["Fry the chorizo until it releases its fat. Add the onions and cook until soft.","Add the tomato-chipotle purée and cook 8 minutes, then add the pork and potato.","Simmer 10 minutes. Serve on tostadas with avocado."],
  pc:"Cook the pork shoulder chunks at high pressure 35 minutes, natural release 10, then shred."}]},

{id:"picadillo", name:"Picadillo", en:"Ground beef with potato and carrot", cat:"guisos", region:"Toda la República", time:"40 min", yield:"6 personas",
 story:"Ground meat cooked with tomato, potato and carrot. Every family has its own, and it fills tacos dorados, gorditas, empanadas and chiles rellenos.",
 ing:[["Picadillo",["1½ lb ground beef (or half beef, half pork)","2 tbsp oil","½ white onion, chopped","2 garlic cloves, minced","3 Roma tomatoes, blended","2 potatoes, in small cubes","2 carrots, in small cubes","½ cup peas, optional","1 serrano, minced, optional","½ tsp ground cumin","1 tsp salt and ¼ tsp pepper","1 cup water or broth"]]],
 steps:["Brown the meat in the oil, breaking it up, until no pink remains. Spoon off the extra fat.",
  "Add the onion, garlic and serrano and cook 3 minutes.",
  "Add the tomato, cumin, salt and pepper and cook 5 minutes.",
  "Add the potatoes, carrots and water. Cover and simmer 15 minutes until tender, adding the peas for the last 5.",
  "Serve with rice, beans and tortillas, or use it as a filling."],
 pc:null, pcNote:"No pressure-cooker version. Picadillo is done in 40 minutes in a skillet, and the browning is where the flavor comes from.",
 tips:["Cut the potatoes and carrots small, about the size of a pea, so every bite gets some."],
 vars:[{name:"Picadillo de Fiesta", en:"Sweet-savory festive picadillo", region:"Puebla",
  note:"The fruit-and-nut filling for chiles en nogada, made July to September when the orchards around Puebla bear fruit. More work, and very good.",
  ing:["1 lb ground pork plus ½ lb ground beef","½ onion and 2 garlic cloves, chopped; 3 tomatoes, blended","1 ripe plantain, 1 pear (pera de leche), 1 peach (durazno criollo) and 1 apple (manzana panochera), all diced small","¼ cup raisins and ¼ cup slivered almonds","¼ cup candied pineapple (real acitrón comes from a protected cactus)","½ tsp cinnamon and a pinch of cloves","Salt and 1 tsp sugar"],
  steps:["Brown the meat with the onion and garlic.","Add the tomato and cook 5 minutes.","Add the apple first, then the pear and peach, then the plantain, nuts, raisins, candied fruit and spices. Cook 15 minutes, until the fruit is tender but holds its shape.","Season with salt and a little sugar. Use to stuff roasted poblanos."]}]},

{id:"chiles-rellenos", name:"Chiles Rellenos", en:"Cheese-stuffed poblanos in egg batter", cat:"guisos", region:"Puebla", time:"1 h 15", yield:"6 chiles",
 story:"Roasted poblanos stuffed with cheese, wrapped in a fluffy egg batter, fried, and served in a thin tomato broth. They take patience. Abuela's are light and puffy, never greasy.",
 ing:[["Chiles",["6 large poblano chiles, flat and straight","12 oz queso Oaxaca, Chihuahua or asadero, cut in sticks","Toothpicks"]],
      ["Capeado (batter)",["5 eggs, separated, at room temperature","Pinch of salt","½ cup flour, for dusting","Oil for frying, about 1 inch deep"]],
      ["Caldillo",["5 Roma tomatoes","¼ white onion","1 garlic clove","1 cup chicken broth","1 tbsp oil","1 bay leaf","Salt, al gusto"]]],
 steps:["Roast the poblanos directly over a gas flame (or under the broiler), turning, until blackened all over.",
  "Put them in a bowl, cover with a plate or a plastic bag, and let them sweat 10 minutes.",
  "Peel off the charred skin with your fingers. Don't rinse them, or you'll wash away the flavor. Cut a slit down one side and carefully pull out the seeds, leaving the stem on.",
  "Stuff each chile with cheese and close the slit with a toothpick.",
  "Make the caldillo: blend the tomatoes, onion and garlic, fry in the oil 5 minutes, add the broth and bay leaf, and simmer 10 minutes. It should be thin. Season.",
  "Beat the egg whites with the salt to stiff peaks. Beat in the yolks one at a time, just until mixed.",
  "Heat the oil to 350°F. Dust each chile with flour, shake off the extra, and dip in the batter to coat.",
  "Fry 2–3 minutes per side, spooning hot oil over the top, until golden. Drain on paper towels and pull out the toothpicks.",
  "Set the chiles in the hot caldillo for a minute and serve with arroz rojo and frijoles."],
 pc:null, pcNote:"No pressure-cooker version. This one belongs to the open flame and the skillet.",
 tips:["The flour is what makes the batter stick. Don't skip it.","Pick poblanos that are smooth and flat. They roast and peel evenly."],
 vars:[{name:"Rellenos de Picadillo", en:"Picadillo-stuffed chiles", region:"Norte · Puebla",
  note:"Stuffed with picadillo instead of cheese.",
  ing:["6 roasted, peeled poblanos","3 cups picadillo (see Picadillo)","Batter and caldillo from the base"],
  steps:["Fill the chiles with picadillo instead of cheese.","Batter, fry and serve in caldillo as in the base."]}]},

/* ---------------- MARISCOS ---------------- */
{id:"aguachile", name:"Aguachile Verde", en:"Raw shrimp cured in lime and chile", cat:"mariscos", region:"Sinaloa", time:"30 min", yield:"4 personas",
 story:"From the coast of Sinaloa: raw shrimp, butterflied and bathed in a blend of lime juice, serrano or chiltepín and cilantro, with cucumber and red onion. It's eaten right away and cold, with tostadas and a cold beer, while the shrimp are still translucent in the middle. The name means chile water.",
 ing:[["El camarón",["1 lb very fresh raw shrimp (about 20 medium), peeled and deveined","Salt, al gusto"]],
      ["El agua",["1 cup fresh lime juice (about 10 limes)","3–5 serranos (or 1 tbsp chiltepín, the Sinaloa way)","½ bunch cilantro","1 garlic clove, optional","½ tsp salt","¼ cup cold water"]],
      ["Encima",["1 cucumber, peeled and thinly sliced","½ red onion, very thinly sliced"]],
      ["Para servir",["1 avocado, sliced","Tostadas or saladitas (saltine crackers)","Salsa negra or Huichol, optional"]]],
 steps:["Butterfly each shrimp: cut along the back almost all the way through and open it flat. Lay them in one layer on a cold plate, salt lightly and refrigerate while you make the agua.",
  "Blend the lime juice, chiles, cilantro, garlic, salt and water until bright green and smooth.",
  "Pour the agua over the shrimp so they're covered. Scatter the cucumber and red onion over the top.",
  "Let it sit 5–10 minutes in the fridge, just until the shrimp turn pink outside but stay translucent in the middle. Longer and they toughen.",
  "Serve right away with avocado, tostadas and a little salsa negra."],
 pc:null, pcNote:"No pressure-cooker version. Aguachile isn't cooked at all: the lime does the work.",
 tips:["Use the freshest shrimp you can find, or shrimp frozen at sea and thawed in the fridge. Raw seafood isn't for pregnant women, small children or anyone with a weak immune system.","Make it right before you eat. Aguachile waits for no one."],
 vars:[{name:"Aguachile Rojo", en:"Red aguachile with chiltepín and chile de árbol", region:"Sinaloa · Sonora",
   note:"The hotter red version, with dried chiles in the agua.",
   ing:["The shrimp, cucumber and red onion from the base","1 cup fresh lime juice","1 tbsp chiltepín","4 chiles de árbol","1 garlic clove","½ tsp salt","¼ cup cold water"],
   steps:["Toast the chiles de árbol a few seconds in a dry pan.","Blend them with the chiltepín, lime juice, garlic, salt and water.","Pour over the butterflied shrimp with the cucumber and onion, wait 5–10 minutes and serve."]}]},

{id:"coctel-de-camaron", name:"Coctel de Camarón", en:"Mexican shrimp cocktail", cat:"mariscos", region:"Sinaloa · Veracruz · la costa", time:"30 min", yield:"4 personas",
 story:"The coctel of every marisquería and beach stand: cooked shrimp in a cold, tangy sauce of catsup, lime and the shrimp's own cooking water, with onion, cilantro, chile and avocado. It comes in a tall glass with saltines and hot sauce, and it's the cure for a hot afternoon.",
 ing:[["El camarón",["1 lb medium shrimp, shell on","4 cups water","1 tsp salt","¼ white onion","1 bay leaf"]],
      ["La salsa",["½ cup catsup","1 cup of the shrimp cooking water, chilled","¼ cup fresh lime juice","1 tbsp Valentina or Huichol hot sauce, plus more al gusto","Salt, al gusto"]],
      ["Con el camarón",["¼ white onion, finely chopped","2 Roma tomatoes, diced","1–2 serranos, minced","¼ cup chopped cilantro","1 cucumber, diced, optional"]],
      ["Para servir",["1 avocado, diced","Limes","Saladitas (saltine crackers) or tostadas"]]],
 steps:["Bring the water to a boil with the salt, onion and bay leaf. Add the shrimp and cook just until pink, 2–3 minutes.",
  "Lift out the shrimp and drop them into ice water. Strain the cooking water, save it and chill it.",
  "Peel the shrimp. Leave a few whole for the top and cut the rest in half if they're large.",
  "Stir together the catsup, [[1 cup]] of the chilled cooking water, the lime juice, hot sauce and salt. It should be loose enough to drink.",
  "Add the shrimp, onion, tomato, serrano, cilantro and cucumber. Chill 15 minutes.",
  "Serve in tall glasses topped with avocado, with limes, saladitas and more hot sauce."],
 pc:null, pcNote:"No pressure-cooker version. Shrimp cook in two minutes and turn rubbery under pressure.",
 tips:["The shrimp cooking water is the secret: it makes the sauce taste of the sea instead of catsup.","Some marisquerías add a splash of Clamato or orange juice. Every puesto has its own."],
 vars:[{name:"Vuelve a la Vida", en:"Back-to-life seafood cocktail", region:"Veracruz",
   note:"Veracruz's campechana of shrimp, octopus, oysters and crab, famous as the cure for la cruda.",
   ing:["½ lb cooked shrimp","½ lb cooked octopus, sliced","12 fresh oysters, shucked, with their liquor","½ cup crab meat","The sauce and chopped vegetables from the base"],
   steps:["Make the sauce and chopped vegetables as in the base, steps 4–5.","Fold in the shrimp, octopus, crab and the oysters with their liquor.","Chill 15 minutes and serve in tall glasses with avocado and saladitas."]}]},

{id:"pescado-veracruzana", name:"Pescado a la Veracruzana", en:"Fish in tomato, olive and caper sauce", cat:"mariscos", region:"Veracruz", time:"45 min", yield:"4 personas",
 story:"Veracruz's best-known dish: huachinango (red snapper), whole or in fillets, simmered in tomato with olives, capers, bay and pickled chiles güeros. The olives and capers came with the Spanish through the port of Veracruz; the chiles are Mexican. It's the classic Friday fish of Cuaresma.",
 ing:[["El pescado",["2 lb red snapper fillets (huachinango), or 1 whole snapper, cleaned","1 lime, juiced","Salt and pepper"]],
      ["La salsa",["¼ cup olive oil","1 white onion, thinly sliced","4 garlic cloves, sliced","2 lb ripe tomatoes, chopped (or 8 Roma)","3 bay leaves","½ tsp Mexican oregano","¼ tsp dried thyme","½ cup green olives (manzanilla), pitted","2 tbsp capers, rinsed","4 chiles güeros en escabeche (or pickled jalapeños), plus a splash of their brine"]],
      ["Para servir",["Arroz blanco","Bolillos"]]],
 steps:["Rub the fish with the lime juice, salt and pepper and let it sit 15 minutes.",
  "Heat the oil in a wide pan and cook the onion until soft, 5 minutes. Add the garlic for 1 minute.",
  "Add the tomatoes, bay leaves, oregano and thyme. Cook 10–12 minutes, until the tomatoes break down into a chunky sauce.",
  "Stir in the olives, capers, chiles güeros and a splash of their brine. Season.",
  "Nestle the fish in the sauce and spoon some over the top. Cover and simmer gently 8–12 minutes, until the fish flakes.",
  "Serve with arroz blanco, and bolillo for the sauce."],
 pc:null, pcNote:"No pressure-cooker version. Fish cooks in minutes, and the sauce is quick on the stove.",
 tips:["Use ripe, soft tomatoes. In winter, good canned whole tomatoes beat pale fresh ones.","Once the fish is in, don't stir or it falls apart. Shake the pan instead."],
 vars:[
  {name:"Tikin Xic", en:"Achiote fish in banana leaf", region:"Yucatán",
   note:"The Maya fish dish: fish rubbed with recado rojo and naranja agria, wrapped in banana leaf with tomato, onion and chile, then grilled or baked.",
   ing:["2 lb firm white fish fillets, or 1 whole fish, butterflied","2 oz achiote paste","½ cup naranja agria (or ⅓ cup orange juice plus 3 tbsp lime juice)","2 garlic cloves","1 tsp salt","Banana leaves","1 tomato, sliced","1 red onion, sliced","1 chile x'catic or güero, sliced"],
