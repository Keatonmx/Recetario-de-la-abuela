   steps:["Blend the achiote, juice, garlic and salt into a smooth paste and rub it all over the fish. Marinate 30 minutes.","Lay the fish on softened banana leaves, top with the tomato, onion and chile, and fold the leaves into a package.","Grill over medium coals or bake at 400°F for 20–25 minutes, until the fish flakes.","Serve with tortillas, cebolla morada encurtida and habanero salsa."]},
  {name:"Pescado Zarandeado", en:"Nayarit grilled butterflied fish", region:"Nayarit · Sinaloa",
   note:"From Mexcaltitán and San Blas: a whole fish split open, brushed with a chile adobo sharpened with soy sauce and lime, and grilled in a hinged basket over mangrove wood.",
   ing:["1 whole snapper or robalo (about 3 lb), butterflied, bones in","4 chiles guajillo","2 chiles ancho","3 garlic cloves","2 tbsp mayonnaise","2 tbsp soy sauce","2 tbsp lime juice","1 tsp salt"],
   steps:["Toast and soak the chiles, then blend them with the garlic, mayonnaise, soy sauce, lime juice and salt into a paste.","Brush it over the flesh side of the fish.","Grill in a hinged basket over medium-hot coals, flesh side down first, 12–15 minutes per side, or broil 6 inches from the heat about 20 minutes.","Serve on the grill with tortillas, salsa, cucumber and red onion."]}
 ]},

{id:"caldo-de-camaron", name:"Caldo de Camarón", en:"Spicy shrimp soup", cat:"mariscos", region:"Sinaloa · Sonora · Jalisco", time:"50 min", yield:"6 personas",
 story:"A brick-red shrimp soup from the Pacific coast, built on dried shrimp and the heads and shells of fresh ones, with guajillo, potatoes and carrots. Marisquerías bring it in a small cup before the meal, and it's what you want after a long night.",
 ing:[["El camarón",["1 lb medium shrimp, shell on (heads on if you can get them)","2 oz dried shrimp (camarón seco), heads and legs pulled off","8 cups water"]],
      ["El caldillo",["4 chiles guajillo","1–2 chiles de árbol, optional","3 Roma tomatoes","¼ white onion","3 garlic cloves","2 tbsp oil","1 tsp Mexican oregano","Salt, al gusto"]],
      ["Las verduras",["2 potatoes, diced","2 carrots, sliced","1 chayote or zucchini, diced, optional"]],
      ["Para servir",["Chopped onion and cilantro","Limes","Tostadas or bolillo"]]],
 steps:["Peel the fresh shrimp and refrigerate them. Put the shells and heads in a pot with the dried shrimp and [[8 cups]] water. Simmer 20 minutes and strain. This is the broth.",
  "Meanwhile, stem and seed the chiles, toast them a few seconds and soak 10 minutes. Blend with the tomatoes, onion, garlic and [[1 cup]] of the broth, and strain.",
  "Heat the oil in the pot and fry the chile purée 5 minutes, until it darkens.",
  "Add the broth, oregano, potatoes and carrots. Simmer 15 minutes, until tender, adding the chayote for the last 8.",
  "Add the peeled shrimp and cook 2–3 minutes, just until pink. Season with salt.",
  "Serve with onion, cilantro, lime and tostadas."],
 pc:{time:"5 min high pressure + 10 min natural release (broth)", total:"35 min",
  steps:["Peel the shrimp and refrigerate them. Put the shells, heads, dried shrimp and [[8 cups]] water in the pot. High pressure 5 minutes, natural release 10. Strain and keep the broth.","Make and fry the chile purée on Sauté as in steps 2–3.","Add the broth, oregano, potatoes and carrots. High pressure 3 minutes, quick release.","On Sauté, add the shrimp and cook 2–3 minutes, just until pink. Season."],
  note:"Never pressure-cook the shrimp themselves; they turn rubbery."},
 tips:["Dried shrimp are salty. Taste before adding any salt.","The heads hold most of the flavor. Ask the fish counter for head-on shrimp."],
 vars:[{name:"Caldo Siete Mares", en:"Seven-seas seafood soup", region:"Toda la costa",
   note:"The big soup of the marisquería: the same red caldillo loaded with fish, shrimp, octopus, crab and clams.",
   ing:["The broth, caldillo and vegetables from the base","½ lb firm white fish, in chunks","½ lb shrimp","½ lb cooked octopus, sliced","2 crab legs (or ½ lb crab)","1 lb clams or mussels, scrubbed"],
   steps:["Make the broth, caldillo and vegetables as in the base, steps 1–4.","Add the crab and clams and cook 4 minutes, until the clams open. Throw out any that don't.","Add the fish and octopus for 3 minutes, then the shrimp for 2.","Serve in big bowls with onion, cilantro, lime and tostadas."]}]},

{id:"camarones-a-la-diabla", name:"Camarones a la Diabla", en:"Shrimp in fiery red chile sauce", cat:"mariscos", region:"Toda la costa", time:"30 min", yield:"4 personas",
 story:"Shrimp in a hot, glossy sauce of guajillo, chile de árbol and chipotle, fried in butter. A la diabla means devil-style: as hot as you dare. Arroz blanco on the side puts out the fire.",
 ing:[["El camarón",["1½ lb large shrimp, peeled and deveined, tails on","Salt, al gusto"]],
      ["La salsa diabla",["4 chiles guajillo","4–8 chiles de árbol","2 chipotles en adobo","3 Roma tomatoes","¼ white onion","3 garlic cloves","½ cup water or shrimp broth","½ tsp Mexican oregano","2 tbsp butter","1 tbsp oil"]],
      ["Para servir",["Arroz blanco or arroz rojo","Limes","Bolillo or tortillas"]]],
 steps:["Toast the guajillos and chiles de árbol a few seconds in a dry pan. Soak in hot water 10 minutes.",
  "Blend the soaked chiles with the chipotles, tomatoes, onion, garlic, oregano and [[½ cup]] water until smooth. Strain.",
  "Heat the butter and oil in a wide pan. Pour in the sauce and fry it 6–8 minutes, stirring, until it darkens and thickens. Season with salt.",
  "Add the shrimp in one layer and cook 2–3 minutes per side, until pink and curled.",
  "Serve right away with rice, lime and bolillo."],
 pc:null, pcNote:"No pressure-cooker version. Shrimp need only a few minutes in the pan.",
 tips:["Set the heat with the chiles de árbol: 4 is spicy, 8 is a la diabla.","Don't crowd the pan, and pull the shrimp as soon as they curl into a C. An O means overcooked."],
 vars:[{name:"Camarones al Mojo de Ajo", en:"Garlic butter shrimp", region:"Toda la costa",
   note:"The mild one at the marisquería: shrimp in golden garlic, butter and lime.",
   ing:["1½ lb large shrimp, peeled","8 garlic cloves, minced","3 tbsp butter","2 tbsp oil","1 chile guajillo, cut in thin rings, optional","1 lime, juiced","Chopped parsley or cilantro","Salt, al gusto"],
   steps:["Warm the oil and butter over low heat and cook the garlic and guajillo slowly, 5–6 minutes, until the garlic is golden. Don't let it burn.","Raise the heat, add the shrimp and cook 2–3 minutes per side.","Add the lime juice, salt and parsley, toss and serve with rice."]}]},

{id:"tostadas-de-ceviche", name:"Tostadas de Ceviche", en:"Lime-cured fish on crisp tostadas", cat:"mariscos", region:"Guerrero · Sinaloa · la costa", time:"1 h", yield:"6 personas",
 story:"On the Mexican coast, ceviche is fish cured in lime until white, then mixed with tomato, onion, cilantro and chile and piled on a crisp tostada with avocado and hot sauce. In Acapulco it gets a splash of catsup; in Sinaloa, cucumber, carrot and a swipe of mayonnaise.",
 ing:[["El pescado",["1 lb very fresh firm white fish (sierra, mahi-mahi, snapper or tilapia), finely diced","1½ cups fresh lime juice","1 tsp salt"]],
      ["Con el pescado",["3 Roma tomatoes, finely diced","½ white onion, finely chopped","2–3 serranos, minced","½ cup chopped cilantro","1 cucumber, finely diced, optional"]],
      ["Para servir",["12 tostadas","2 avocados, sliced","Mayonnaise, optional, the Sinaloa way","Valentina or Huichol hot sauce","Limes"]]],
 steps:["Put the fish in a glass bowl with the salt and enough lime juice to cover. Refrigerate 30–40 minutes, stirring once, until the fish is white all the way through.",
  "Drain off most of the lime juice.",
  "Fold in the tomato, onion, serrano, cilantro and cucumber. Taste for salt.",
  "Spread each tostada thinly with mayonnaise if you like, pile on the ceviche and top with avocado and hot sauce."],
 pc:null, pcNote:"No pressure-cooker version. The lime cooks the fish.",
 tips:["Cut the fish small and even so it all cures at the same time.","Use a glass or ceramic bowl, not metal, for the lime.","Very fresh fish only. Raw seafood isn't for pregnant women or small children."],
 vars:[{name:"Ceviche de Camarón", en:"Shrimp ceviche", region:"Sinaloa",
   note:"With shrimp instead of fish, cured raw like aguachile or poached a minute first.",
   ing:["1 lb shrimp, peeled, deveined and chopped","1 cup fresh lime juice","The tomato, onion, serrano, cilantro and cucumber from the base","1 carrot, finely grated"],
   steps:["Cure the shrimp in the lime juice 20 minutes in the fridge, or poach them 1 minute and chill them first.","Drain and fold in the vegetables and carrot.","Serve on tostadas with avocado."]}]},

/* ---------------- MOLES ---------------- */
{id:"mole-poblano", name:"Mole Poblano", en:"Chile, chocolate and spice sauce with turkey", cat:"moles", region:"Puebla", time:"4 h", yield:"12 personas",
 story:"Mole poblano is the dish for weddings, baptisms and Día de Muertos. Dozens of ingredients, each one fried or toasted on its own, then ground together and cooked slowly until the fat rises to the top. Abuelas make it in big batches with the whole family helping. Puebla's legend credits Sor Andrea de la Asunción at the Convento de Santa Rosa around 1680, though no document proves it.",
 ing:[["La carne",["1 turkey (guajolote), in pieces, or 2 chickens","1 white onion, 1 head garlic and salt","About 10 cups of the cooking broth"]],
      ["Los chiles",["8 chiles mulato","6 chiles ancho","6 chiles pasilla","2 chiles chipotle mora, optional","1 tbsp of the chile seeds, saved"]],
      ["Semillas y frutas",["⅓ cup sesame seeds, plus more for garnish","¼ cup almonds, skin on","¼ cup peanuts","2 tbsp pepitas","¼ cup raisins","1 very ripe plantain (black skin), sliced","1 stale corn tortilla","1 slice day-old bolillo or white bread"]],
      ["Especias",["1-inch stick Mexican cinnamon (canela)","4 whole cloves","6 black peppercorns","3 allspice berries","¼ tsp anise seed","¼ tsp coriander seed","½ tsp dried thyme","½ tsp Mexican oregano"]],
      ["Lo demás",["2 Roma tomatoes and 2 tomatillos, charred","½ white onion and 4 garlic cloves, charred","¾ cup lard","2 oz Mexican chocolate (½ tablet)","1–2 tbsp sugar, al gusto","Salt, al gusto"]]],
 steps:["Simmer the turkey with the onion, garlic and salt until tender, about 1½ hours (40 minutes for chicken). Keep the broth.",
  "Stem and seed the chiles, saving [[1 tbsp]] of seeds. Fry the chiles a few seconds per side in hot lard, just until they blister and change color. Soak in hot broth 30 minutes.",
  "In the same lard, fry each of these separately and set aside: almonds, peanuts, pepitas, raisins (until they puff), plantain (until dark golden), tortilla (until crisp) and bread (until golden).",
  "On a dry comal, toast the sesame until golden, the saved chile seeds until very dark, and the spices for 30 seconds.",
  "Blend the chiles with enough soaking liquid to make a smooth purée.",
  "Blend the nuts, seeds, fruit, tortilla, bread, spices, tomatoes, tomatillos, onion and garlic with broth, in batches, until completely smooth. Strain both purées if you want a silky mole.",
  "Heat [[3 tbsp]] lard in a large heavy pot or cazuela until very hot. Pour in the chile purée all at once (stand back, it splatters). Fry it, stirring constantly, 15 minutes until it darkens and thickens. This is called frying the mole.",
  "Add the nut purée and cook 20 minutes, stirring often.",
  "Add the chocolate, sugar and salt, and enough broth that it coats the back of a spoon. Simmer on low 45–60 minutes, stirring often so it doesn't stick, until a sheen of fat rises to the surface.",
  "Add the turkey and heat through. Serve with sesame seeds, arroz rojo and tortillas."],
 pc:{time:"Turkey: 25 min high pressure + 15 min natural release", total:"About 2 h 30",
  steps:["Pressure-cook the turkey pieces with the onion, garlic, salt and water to the fill line: high pressure 25 minutes (12 for chicken), natural release 15. Keep the broth.","Make the mole sauce on the stove as in steps 2–9. The frying and slow simmer can't be rushed under pressure, and a thick mole will set off the burn warning."],
  note:"The sauce still takes about 2 hours on the stove. Make a big batch of the fried mole paste; it freezes for months."},
 tips:["Mole is better on the second day.","Many poblano families take the fried chiles and seeds to the neighborhood molino to be ground.","If you use store-bought mole paste, fry it in lard first, then thin it with broth and add a piece of Mexican chocolate. Not abuela's, but honest.","The fat rising to the top is how you know it's done."],
 vars:[{name:"Pipián Verde", en:"Green pumpkin-seed mole", region:"Puebla · Tlaxcala · Centro",
  note:"A pre-Hispanic green mole thickened with pepitas instead of nuts and dried chiles. Lighter and quicker than mole poblano. Many cooks call nearly the same dish mole verde.",
  ing:["2 lb chicken pieces, poached, plus the broth","1 cup raw hulled pepitas","1 lb tomatillos","2–3 serranos","¼ onion and 2 garlic cloves","4 romaine or radish leaves","1 sprig epazote, 2 hoja santa leaves and a handful of cilantro","2 tbsp lard","Salt, al gusto"],
  steps:["Toast the pepitas until they pop but don't brown. Let cool.","Simmer the tomatillos and serranos 8 minutes and drain.","Blend everything except the chicken, lard and salt with [[2 cups]] broth until very smooth.","Fry the sauce in the lard over medium 5 minutes, stirring, then thin with broth.","Simmer gently 15 minutes, never at a hard boil or it will split. Add the chicken and season."],
  pc:"Cook the chicken at high pressure 12 minutes, natural release 10. Make the sauce on the stove."}]},

/* ---------------- MASA Y TORTILLA ---------------- */
{id:"tamales-rojos", name:"Tamales Rojos de Puerco", en:"Red chile pork tamales", cat:"masa", region:"Norte · Centro", time:"5 h 30", yield:"About 48",
 story:"Tamales are a group effort. The tamalada, usually before Christmas, puts the whole family at the table spreading masa. Red pork tamales are the classic.",
 ing:[["El relleno",["2½ lb pork shoulder, in large chunks","½ onion, 3 garlic cloves and 1 tbsp salt","8 chiles guajillo","3 chiles ancho","2 garlic cloves, ½ tsp cumin and ½ tsp Mexican oregano","2 tbsp lard"]],
      ["La masa",["4 lb fresh unprepared masa for tamales (from a tortillería), or 6 cups masa harina for tamales mixed with about 5 cups warm broth","2 cups (450 g) fresh pork lard, not hydrogenated","2 tsp baking powder","1 tbsp salt","1–2 cups warm pork broth","½ cup of the red chile sauce, for color"]],
      ["Las hojas",["60 dried corn husks, soaked in hot water 1 hour"]]],
 steps:["Cover the pork with water, add the onion, garlic and salt, and simmer 2 hours until tender. Shred and keep the broth.",
  "Toast, soak and blend the chiles with the garlic, cumin, oregano and [[1½ cups]] broth. Strain.",
  "Fry the sauce in the lard 5 minutes. Set aside [[½ cup]] for the masa. Add the pork to the rest and simmer 15 minutes until thick, not soupy. Let cool.",
  "Beat the lard with a mixer 3–5 minutes until white and fluffy.",
  "Add the masa a handful at a time, alternating with the broth, baking powder, salt and reserved chile. Beat 10 minutes. It should feel like soft peanut butter.",
  "Do the float test: drop ½ tsp of masa into a glass of cold water. If it floats, it's ready. If it sinks, beat longer or add a little more lard.",
  "Take a husk, smooth side up, wide end toward you. Spread 2–3 tbsp masa thinly over the top two-thirds, leaving a border at the sides. Add a spoonful of filling.",
  "Fold the sides over each other, then fold the narrow tail up.",
  "Fill the bottom of a tamalera with water below the rack. Stand the tamales upright, open end up. Cover with extra husks and a damp towel, then the lid.",
  "Steam over medium 1¼–1½ hours. They're done when the husk peels away cleanly from the masa. Let rest 15 minutes before serving."],
 pc:{time:"25 min high pressure + 15 min natural release", total:"1 h after assembly",
  steps:["Make the filling and masa and assemble the tamales as above. The pork can also go under pressure: 35 minutes high, natural release 10.","Put the trivet in the pot with 1½ cups water. Stand the tamales upright, open end up, snug but not tight. A 6-qt pot holds 12–15.","High pressure 25 minutes, natural release 15.","Let rest 10 minutes. They firm up as they cool."],
  note:"Reheat frozen tamales at high pressure 15 minutes with 1 cup water."},
 tips:["Drop a coin in the water under the rack. While it rattles there's water; when it goes quiet, add more hot water.","Abuelas say tamales se sienten: make them while angry and they won't cook through, and lift the lid too often and they come out pintos (half raw). A pregnant helper ties a red ribbon around her belly, and some cooks sing to the pot.","The old way to leaven: instead of baking powder, boil tomatillo husks with a pinch of tequesquite, strain, and beat that water into the masa.","Fresh lard from the carnicería makes the masa taste right. The white blocks from the supermarket shelf don't."],
 vars:[
  {name:"Tamales de Rajas con Queso", en:"Poblano strip and cheese tamales", region:"Centro",
   note:"The meatless favorite, for Lent or for anyone.",
   ing:["Masa from the base, made without the chile and with chicken or vegetable broth","4 poblanos, roasted, peeled and cut in strips","12 oz queso Oaxaca or panela, in sticks","1 cup salsa verde"],
   steps:["Spread masa on each husk.","Add a few poblano strips, a stick of cheese and a spoonful of salsa verde.","Fold and steam as in the base."],
   pc:"Same as the base: high pressure 25 minutes, natural release 15."},
  {name:"Tamales de Dulce", en:"Sweet pink tamales", region:"Centro",
   note:"Sweet tamales for Christmas and Día de la Candelaria, served with champurrado. On February 2, whoever found the muñeco in the Rosca de Reyes on January 6 pays for the tamales.",
   ing:["2 lb fresh masa (half the base)","⅔ cup lard","¾ cup sugar","1 tsp baking powder and ½ tsp salt","½ cup raisins","1 tsp ground cinnamon","A few drops of red food coloring (the traditional pink) or a little beet juice"],
   steps:["Beat the lard until fluffy. Beat in the masa, sugar, baking powder, salt, cinnamon and color until a little ball floats in water.","Fold in the raisins.","Spread on husks with no filling, fold, and steam 1 hour."],
   pc:"High pressure 20 minutes, natural release 15."}
 ]},

{id:"enchiladas-rojas", name:"Enchiladas Rojas", en:"Red chile enchiladas with queso fresco", cat:"masa", region:"Guanajuato · Centro", time:"45 min", yield:"4–6 personas",
 story:"Tortillas dipped in red chile, fried and rolled around cheese and onion. In Guanajuato they come topped with fried potatoes and carrots: enchiladas mineras, said to be what miners' wives carried up to the mines. In Real del Monte, Hidalgo, the mineras are made with salsa verde.",
 ing:[["La salsa",["6 chiles guajillo","2 chiles ancho","2 garlic cloves","¼ white onion","½ tsp Mexican oregano","Pinch of cumin","2 cups broth or soaking water","1 tbsp lard","Salt, al gusto"]],
      ["Las enchiladas",["12 corn tortillas","Oil or lard for frying","2 cups crumbled queso fresco (or queso ranchero)","1 white onion, finely chopped"]],
      ["Encima",["2 potatoes and 2 carrots, diced and boiled","Shredded lettuce","Chiles en vinagre (jalapeños with carrot)","Crema, optional","A piece of fried chicken, optional"]]],
 steps:["Toast and soak the chiles. Blend with the garlic, onion, oregano, cumin and [[2 cups]] liquid. Strain.",
  "Fry the sauce in the lard 5 minutes and season. It should be about as thick as cream. Keep warm.",
  "Mix the queso and onion for the filling, saving some for the top.",
  "Heat ½ inch of oil in a skillet. Pass each tortilla through the warm sauce, then fry it 10 seconds per side. (For less splatter, fry first and then dip.)",
  "Fill with cheese and onion, roll, and set on a plate.",
  "Fry the boiled potatoes and carrots in the same oil until golden.",
  "Top with more sauce, the potatoes and carrots, lettuce, chiles en vinagre, crema and the rest of the cheese."],
 pc:null, pcNote:"No pressure-cooker version. Enchiladas are made at the skillet, one tortilla at a time.",
 tips:["Work fast and serve right away. Enchiladas don't like to wait."],
 vars:[{name:"Enfrijoladas", en:"Tortillas in black bean sauce", region:"Oaxaca",
  note:"Tortillas bathed in a seasoned black bean sauce instead of chile.",
  ing:["3 cups frijoles negros de la olla with their broth","1 chile pasilla or chipotle, toasted","2 dried avocado leaves, toasted","12 corn tortillas","Queso fresco, crema and onion; shredded chicken optional"],
  steps:["Blend the beans with their broth, the chile and the avocado leaves until smooth, like thin cream.","Simmer 5 minutes and season.","Fry the tortillas lightly, dip them in the bean sauce, and fold in quarters or fill with cheese or chicken.","Top with crema, queso and onion."]}]},

/* ---------------- DESAYUNOS ---------------- */
{id:"huevos-rancheros", name:"Huevos Rancheros", en:"Ranch-style fried eggs in salsa ranchera", cat:"desayunos", region:"Centro · Norte", time:"25 min", yield:"2 personas",
 story:"The almuerzo of the rancho: fried eggs on soft fried tortillas, covered with a cooked salsa of charred tomato and chile. The salsa is served warm, not raw like pico de gallo, and the beans go on the side.",
 ing:[["Salsa ranchera",["4 Roma tomatoes (about 1 lb)","2 serranos or 1 jalapeño","¼ white onion, plus 2 thin slices of onion","1 garlic clove, unpeeled","1 tbsp lard or oil","Salt, al gusto"]],
      ["Los huevos",["4 corn tortillas","4 eggs","3–4 tbsp lard or oil, for the tortillas and eggs","Salt, al gusto"]],
      ["Para servir",["Frijoles refritos","Crumbled queso fresco","Sliced avocado","Chopped cilantro","More warm tortillas"]]],
 steps:["Char the tomatoes, chiles, onion chunk and garlic on a dry comal, turning, until blistered and soft: about 8 minutes for the garlic and chiles, 12 for the tomatoes. Peel the garlic.",
  "Blend or grind them in the molcajete with a pinch of salt. Keep it a little chunky.",
  "Heat the lard in a small pan and fry the onion slices until soft. Pour in the salsa (it will sizzle) and simmer 5–8 minutes, until it darkens and thickens slightly. Season and keep warm.",
  "In a skillet, heat a thin layer of lard. Fry each tortilla about 10 seconds per side, so it softens and puffs a little but doesn't turn into a tostada. Drain and set two on each plate.",
  "In the same skillet, fry the eggs over medium-high, spooning hot fat over the whites until they set with lacy, crisp edges and the yolks stay runny. Salt them.",
  "Set an egg on each tortilla and spoon the hot salsa over the whites, leaving the yolks showing.",
  "Serve right away with refritos, queso fresco, avocado and cilantro."],
 pc:null, pcNote:"No pressure-cooker version. Huevos rancheros are done in 25 minutes at the comal and skillet. If you want refritos on the side, the beans can come from the pressure cooker (see Frijoles de la Olla).",
 tips:["Fry the tortillas soft, not crisp. You should be able to cut them with the side of your fork.","Make a double batch of salsa ranchera. It keeps 4 days in the fridge and saves the next breakfast.","Lard for the eggs gives the crisp edges abuela's had."],
 vars:[
  {name:"Huevos Divorciados", en:"Two eggs, two salsas", region:"Ciudad de México · Centro",
   note:"The divorced eggs: one in red salsa, one in green, kept apart by a line of refried beans. Diner breakfast all over Mexico.",
   ing:["4 fried tortillas and 4 fried eggs, as in the base","1 cup salsa ranchera (from the base)","1 cup salsa verde cocida (see Salsa Roja de Molcajete, Variantes)","1 cup frijoles refritos","Queso fresco and chilaquiles or totopos on the side, optional"],
   steps:["For each plate, set two tortillas side by side and put an egg on each.","Cover one with red salsa and the other with green.","Spoon a line of refried beans between them to keep them apart.","Top with queso fresco."]},
  {name:"Huevos Motuleños", en:"Yucatecan stacked eggs with ham and plantain", region:"Motul, Yucatán",
   note:"From the town of Motul: a crisp tortilla spread with black beans, a fried egg, tomato sauce, ham and peas, with fried plantain on the side. Usually credited to Jorge Siqueff at La Sin Rival in Motul, around 1921.",
   ing:["4 corn tortillas, fried crisp","1 cup refried black beans","4 eggs, fried","1 cup salsa ranchera made with habanero instead of serrano (or plain tomato sauce)","½ cup diced ham","½ cup cooked peas","½ cup crumbled queso fresco","1 ripe plantain, sliced and fried"],
   steps:["Warm the salsa with the ham and peas for 3 minutes.","Spread each crisp tortilla with black beans and top with a fried egg.","Spoon the salsa with ham and peas over the eggs and sprinkle with queso.","Serve with the fried plantain."]}
 ]},

{id:"molletes", name:"Molletes", en:"Open-face bean and cheese bolillos", cat:"desayunos", region:"Ciudad de México · Centro", time:"20 min", yield:"4 personas",
 story:"Bolillos split open, toasted with butter, spread with refried beans and broiled under melted cheese, then topped with cold pico de gallo. The breakfast of cafés and school mornings in the capital, and the best use for yesterday's bread.",
 ing:[["Molletes",["4 bolillos (day-old is fine), or crusty French rolls","3 tbsp soft butter","2 cups frijoles refritos, warm and thick","2 cups shredded melting cheese: queso Chihuahua, manchego mexicano or Oaxaca"]],
      ["Pico de gallo",["2 Roma tomatoes, finely diced","¼ white onion, finely diced","1 serrano, minced","¼ cup chopped cilantro","Juice of 1 lime","Salt, al gusto"]],
      ["Para servir",["Salsa verde or salsa roja","Sliced avocado, optional"]]],
 steps:["Heat the broiler (or the oven to 425°F). Mix all the pico de gallo ingredients and let stand while you make the molletes.",
  "Split the bolillos lengthwise. Pull out a little of the soft crumb so the beans have room.",
  "Butter the cut sides and toast them, cut side up, 2–3 minutes until the edges are golden.",
  "Spread each half generously with refritos, edge to edge so the bread doesn't burn.",
  "Cover with cheese and broil 2–4 minutes, until melted and bubbling in spots.",
  "Top with pico de gallo and serve with salsa on the side."],
 pc:null, pcNote:"No pressure-cooker version for the molletes themselves, but the beans can come from the pressure cooker (see Frijoles de la Olla, then Frijoles Refritos).",
 tips:["The refritos should be thick enough to hold a line. Runny beans make soggy bread.","Butter first, then toast, then beans. That way the bread stays crisp underneath."],
 vars:[
  {name:"Molletes con Chorizo", en:"Molletes with chorizo", region:"Centro",
   note:"The most common add-on at fondas.",
   ing:["Everything from the base","6 oz Mexican chorizo, casing removed"],
   steps:["Fry the chorizo, breaking it up, until crisp. Drain off most of the fat (or fry the beans in it).","Spread the beans on the toasted bread, scatter chorizo over them, add the cheese and broil.","Top with pico de gallo."]},
  {name:"Molletes Dulces", en:"Butter, sugar and cinnamon molletes", region:"Centro",
   note:"The sweet version kids ask for, with a cup of café con leche or champurrado.",
   ing:["4 bolillos, split","4 tbsp soft butter","¼ cup sugar mixed with 1 tsp ground canela"],
   steps:["Butter the cut sides generously.","Sprinkle with the cinnamon sugar.","Broil 2–3 minutes, until the sugar melts and bubbles. Watch closely; it burns fast."]}
 ]},

{id:"huevos-a-la-mexicana", name:"Huevos a la Mexicana", en:"Eggs scrambled with tomato, onion and chile", cat:"desayunos", region:"Toda la República", time:"10 min", yield:"2 personas",
 story:"Red tomato, white onion and green chile, the colors of the flag, scrambled with eggs. It's the breakfast every Mexican home makes without a recipe, and it's what goes into a taco on the way out the door.",
 ing:[["Huevos",["4 eggs","1 tbsp lard or oil","¼ white onion, finely chopped","1–2 serranos, finely chopped (seeds in for more heat)","1 Roma tomato, chopped","Salt, al gusto","1 tbsp chopped cilantro, optional"]],
      ["Para servir",["Frijoles de la olla or refritos","Warm corn or flour tortillas","Salsa"]]],
 steps:["Heat the lard in a skillet over medium. Add the onion and serrano and cook 2 minutes, until soft but not browned.",
  "Add the tomato and a pinch of salt. Cook 2–3 minutes, until it softens and most of its juice cooks off.",
  "Beat the eggs lightly with a pinch of salt and pour them into the pan.",
  "Stir gently with a spatula over medium-low until just set, still soft and moist.",
  "Add the cilantro if using and serve right away with beans, tortillas and salsa."],
 pc:null, pcNote:"No pressure-cooker version. It's a 10-minute skillet breakfast.",
 tips:["Let the tomato cook down first, or the eggs turn watery.","Some abuelas don't beat the eggs first: they crack them right into the pan and stir, so you get streaks of white and yolk.","Leftovers make the best tacos de huevo for lunch."],
 vars:[
  {name:"Huevos con Chorizo", en:"Eggs scrambled with chorizo", region:"Toda la República",
   note:"The other everyday breakfast taco. Some families add a diced potato fried with the chorizo.",
   ing:["4 eggs, lightly beaten","4 oz Mexican chorizo, casing removed","¼ onion, chopped, optional","1 small potato, diced small, optional","Salt, only if needed"],
   steps:["Fry the chorizo in a dry skillet, breaking it up, until it releases its red fat, about 4 minutes. Add the onion and potato and cook until the potato is tender, about 8 minutes.","Pour off extra fat if there's a lot. Add the eggs and stir until just set.","Taste before salting; chorizo is salty."]},
  {name:"Huevos con Nopales", en:"Eggs with cactus paddles", region:"Centro",
   note:"A Lent favorite, and a way to stretch the eggs.",
   ing:["4 eggs, lightly beaten","1 cup cooked nopales, in strips (from a jar, rinsed, or fresh and boiled)","Everything else from the base"],
   steps:["Make the base through step 2, adding the nopales with the tomato and cooking until any slime has cooked off.","Add the eggs and stir until just set."]}
 ]},

{id:"machaca-con-huevo", name:"Machaca con Huevo", en:"Dried shredded beef scrambled with eggs", cat:"desayunos", region:"Sonora · Chihuahua · Nuevo León", time:"20 min", yield:"3 personas",
 story:"Machaca is beef that was salted, sun-dried and pounded so it would keep for months on the ranches of the north. A small handful fried with onion, tomato and chile and scrambled with eggs makes a breakfast wrapped in flour tortillas, the tortilla of the north.",
 ing:[["Machaca",["1 cup (about 2 oz) machaca (dried shredded beef, sold in bags at Mexican markets, or see Machaca Casera)","6 eggs","1 tbsp lard or oil","½ white onion, chopped","1 Roma tomato, chopped","1–2 jalapeños or serranos, chopped, or 1 roasted chile verde (Anaheim), in strips, the Sonora way","Salt, only if needed"]],
      ["Para servir",["Warm flour tortillas","Frijoles de la olla or refritos","Salsa roja or chiltepín salsa"]]],
 steps:["If your machaca is in big strands, pull it apart with your fingers. Taste a piece. If it's very salty or hard, soak it in warm water 5 minutes and squeeze it dry.",
  "Heat the lard in a skillet over medium. Fry the machaca 1–2 minutes, stirring, until it smells toasty and crisps a little.",
  "Add the onion and chile and cook 3 minutes until soft. Add the tomato and cook 2 minutes more.",
  "Beat the eggs lightly without salt; the machaca is already salty.",
  "Pour the eggs into the pan and stir gently over medium-low until just set, still soft and moist.",
  "Taste, add salt only if needed, and serve right away with flour tortillas, beans and salsa."],
 pc:null, pcNote:"The eggs are a quick skillet job, but you can make the machaca itself in the pressure cooker. See Machaca Casera under Variantes.",
 tips:["Go easy on the salt. Taste the machaca first; most of it is salted.","In Monterrey they call this machacado con huevo and make it with more tomato and chile, almost saucy. Nuevo León traces it to Ciénega de Flores, where la Tía Lencha fed it to road crews in the 1920s.","Leftover machaca keeps for weeks in a jar in the fridge."],
 vars:[
  {name:"Machaca Casera", en:"Homemade dried beef", region:"Sonora · Norte",
   note:"Real sun-dried machaca is hard to find outside the north. This oven-dried version gets close.",
   ing:["2 lb beef flank or skirt steak, in 3 pieces","½ onion and 3 garlic cloves","1 tbsp salt, plus more al gusto","Juice of 1 lime","½ tsp black pepper"],
   steps:["Simmer the beef with the onion, garlic, salt and water to cover 2 hours, until it shreds easily.","Drain and shred it very finely with two forks or your fingers.","Toss with the lime juice, pepper and a little more salt.","Spread thinly on sheet pans and dry in a 200°F oven 2–3 hours, stirring every 30 minutes, until dry and leathery but not burnt.","Pound it in a molcajete or pulse briefly in a food processor until it's fluffy and fine. Store in a jar in the fridge."],
   pc:"Cook the beef with the onion, garlic, salt and 2 cups water at high pressure 35 minutes, natural release 15. Then shred, season and oven-dry as above."},
  {name:"Burritos de Machaca", en:"Machaca breakfast burritos", region:"Sonora · Chihuahua",
   note:"In Sonora and Ciudad Juárez burritos are slim and simple, just a filling and a thin flour tortilla. No rice inside.",
   ing:["Machaca con huevo from the base","Large thin flour tortillas (sobaqueras if you can find them)","Frijoles refritos, optional"],
   steps:["Warm the tortillas on the comal until soft and spotted.","Spread a thin line of beans if using, add a line of machaca con huevo, and roll tightly.","Set seam side down on the comal 30 seconds to seal. Eat with salsa."]}
 ]},

{id:"chilaquiles", name:"Chilaquiles Verdes", en:"Tortilla chips simmered in green salsa", cat:"desayunos", region:"Toda la República", time:"30 min", yield:"4 personas",
 story:"Breakfast made from whatever tortillas are in the kitchen: fried, tossed in salsa or chile, and covered with crema and cheese, or cooked together with eggs. The name comes from the Nahuatl chīlāquilitl, roughly 'soaked in chile'. ¿Crujientes o aguados? ¿Frijoles encima o al lado? Every house decides.",
 ing:[["Totopos",["12 corn tortillas, cut in 6 wedges: day-old is the classic, but store-bought or same-morning work fine","Oil for frying","Salt, al gusto"]],
      ["Salsa verde",["1 lb tomatillos, husked","2–3 serranos","¼ white onion","1 garlic clove","Handful of cilantro","1 cup chicken broth","1 tbsp oil","1 sprig epazote, optional"]],
      ["Encima",["Crema","Crumbled queso fresco","Thin onion rings","Avocado","Fried eggs or shredded chicken","Frijoles refritos on the side"]]],
 steps:["Cut the tortillas. Store-bought tortillas fry fine as they are. Very fresh, moist homemade ones splatter less if they sit out on the counter a few minutes first.",
  "Fry in hot oil in batches until golden. For crunchy chilaquiles fry them crisp; for soft ones, take them out while they're still a little chewy. Drain and salt.",
  "Simmer the tomatillos and serranos 8 minutes. Blend with the onion, garlic, cilantro and broth.",
  "Heat the oil in a wide pan and fry the salsa 5 minutes with the epazote.",
  "Add the totopos and toss: 1 minute for crunchy, 3 for soft.",
  "Serve right away with crema, queso, onion, avocado and an egg or chicken, with beans on the side."],
 pc:null, pcNote:"No pressure-cooker version. Chilaquiles take 30 minutes and have to be eaten the moment they're ready.",
 tips:["Drain the fried tortillas well. Fresher tortillas hold a little more oil.","Leftover red chile from enchiladas or tamales makes great chilaquiles."],
 vars:[{name:"Chilaquiles con Huevo, Estilo de Casa", en:"Soft chilaquiles with red chile and eggs", region:"Mexican-American · Texas · California",
  note:"How a lot of Mexican-American families make them: store-bought or same-morning tortillas fried soft, not crunchy like chips, then cooked in the pan with red chile and eggs.",
  ing:["10–12 corn tortillas, store-bought or homemade, cut or torn into strips or pieces","¼ cup oil","4–6 eggs","1½ cups red chile (below), or leftover enchilada chile or salsa","Salt, al gusto","For the red chile: 6 dried New Mexico, California or guajillo chiles","2 garlic cloves","Pinch of cumin","½ tsp Mexican oregano","½ tsp salt","2 cups water","To serve: shredded cheese or queso fresco, frijoles, warm tortillas"],
  steps:["Make the chile: stem and seed the chiles, simmer them in the water 10 minutes, then blend with the garlic, cumin, oregano and salt. Strain.","Heat the oil in a large skillet over medium-high. Fry the tortilla pieces, stirring, 3–4 minutes, until golden in spots but still soft and a little chewy. Pour off extra oil.","For eggs fried first: push the tortillas to the side, crack the eggs into the pan and let them fry a minute until the whites start to set. Then break them up and mix them through the tortillas.","For scrambled: beat the eggs with a pinch of salt, pour them over the tortillas and stir until just set.","Pour in the chile and toss everything together. Simmer 1–2 minutes, until the tortillas soak it up.","Top with cheese and serve with beans and tortillas."]},
  {name:"Chilaquiles Rojos", en:"Red chilaquiles", region:"Toda la República",
  note:"The same method with a red salsa of tomato and dried chiles.",
  ing:["Totopos from the base","4 Roma tomatoes","3 chiles guajillo and 2 chiles de árbol, toasted and soaked","1 garlic clove, ¼ onion and 1 cup broth"],
  steps:["Blend the tomatoes, chiles, garlic, onion and broth, and strain.","Fry the salsa 5 minutes and season.","Toss with the totopos and top as in the base."]}]},

/* ---------------- FRIJOLES Y ARROZ ---------------- */
{id:"frijoles-de-olla", name:"Frijoles de la Olla", en:"Pot beans with epazote", cat:"frijoles", region:"Toda la República", time:"2 h 30", yield:"8 personas",
 story:"The pot that's always on abuela's stove. Pintos and bayos in the north; bayos, flor de mayo and peruanos as much as black in the center; black beans in the south and along the Gulf. All of them cooked slowly with onion, lard and epazote. The broth matters as much as the beans.",
 ing:[["Frijoles",["1 lb dried pinto or black beans","10 cups water","¼ white onion","2 garlic cloves","2 tbsp lard","2 tsp salt","1 sprig epazote (essential for black beans)"]],["Para servir",["Chopped onion and cilantro","Sliced serrano","Crumbled queso fresco"]]],
 steps:["Spread the beans on a tray and pick out stones and broken beans. Rinse well.",
  "Put the beans, water, onion, garlic and lard in a heavy pot (a lead-free clay olla if you have one). Bring to a boil.",
  "Lower to a gentle simmer, partly covered, for 1½–2 hours. If you need more water, add hot water only. Cold water toughens the skins.",
  "When the beans are soft, add the salt and epazote. Simmer 30 minutes more so the salt gets in.",
  "Serve in bowls with their broth, chopped onion, cilantro, serrano and queso fresco, or use them for refritos."],
 pc:{time:"45 min high pressure + full natural release", total:"1 h 45",
  steps:["Rinse and pick over the beans. No soaking needed.","Put the beans, [[8 cups]] water, onion, garlic and lard in the pot.","High pressure 45 minutes for pintos, 35 for black beans (10–12 if soaked overnight). Let the pressure release naturally, about 25 minutes.","Add the salt and epazote and simmer on Sauté 10–15 minutes."],
  note:"Don't fill past the halfway line with beans and water. Beans foam."},
 tips:["Salt goes in after the beans are soft.","Clay ollas give the best beans, but buy ones marked Sin Plomo (lead-free). Old or unmarked glazes can leach lead.","Old beans take forever. Buy them where a lot of people buy beans."],
 vars:[
  {name:"Frijoles Refritos", en:"Refried beans", region:"Toda la República",
   note:"Fried once, in plenty of lard. Refritos means well-fried, not fried twice.",
   ing:["4 cups cooked beans plus 1 cup of their broth","3–4 tbsp lard (or bacon or chorizo fat)","¼ white onion, chopped","Queso fresco or Chihuahua, optional"],
   steps:["Heat the lard in a wide skillet and fry the onion until golden. Take the onion out if you like.","Add the beans and broth and mash with a bean masher as they cook.","Keep cooking and stirring about 10 minutes, until thick enough to hold a line when you drag a spoon through. Add broth if it gets too thick.","Top with cheese."]},
  {name:"Frijoles Charros", en:"Cowboy beans", region:"Nuevo León · Norte",
   note:"For carne asada Sundays. In Monterrey, chicharrón goes in at the end. Add a beer and some call them frijoles borrachos; families argue about where one ends and the other begins.",
   ing:["6 cups pinto beans de la olla with their broth","4 slices bacon, chopped","4 oz Mexican chorizo","2 hot dogs (salchichas) and 2 slices ham, chopped","½ onion, 2 tomatoes and 2 jalapeños, chopped","Handful of cilantro","1 Mexican beer, optional","2 oz chicharrón, broken up"],
   steps:["Fry the bacon until crisp. Add the chorizo, then the salchicha and ham, and brown.","Add the onion, tomato and jalapeño and cook 5 minutes.","Add the beans with their broth (and the beer). Simmer 20 minutes.","Stir in the cilantro and the chicharrón right before serving."],
   pc:"Cook the beans under pressure as in the base, then finish on Sauté."}
 ]},

{id:"arroz-rojo", name:"Arroz Rojo", en:"Mexican red rice", cat:"frijoles", region:"Toda la República", time:"55 min", yield:"6 personas",
 story:"Fried until golden before any liquid goes in, then cooked in tomato broth and left alone. It goes next to everything, and into caldo.",
 ing:[["Arroz",["1½ cups long-grain white rice","3 tbsp oil","2 Roma tomatoes","¼ white onion","1 garlic clove","2¾ cups hot chicken broth","1 tsp salt","1 carrot, diced, and ½ cup peas, optional","1 sprig cilantro","1 serrano, whole"]]],
 steps:["Soak the rice in hot water 10 minutes. Rinse until the water runs clear, then drain very well.",
  "Heat the oil in a wide pot over medium. Add the rice and stir until it turns opaque and light golden and sounds like sand, about 8 minutes.",
  "Blend the tomatoes, onion and garlic with [[½ cup]] of the broth. Strain onto the rice and stir 2–3 minutes, until absorbed and the color deepens.",
  "Add the rest of the broth, the salt, carrot, peas, cilantro and serrano. Bring to a boil.",
  "Cover, turn the heat to its lowest setting and cook 18 minutes. Don't lift the lid or stir.",
  "Turn off the heat and let rest 10 minutes, covered. Fluff with a fork."],
 pc:{time:"4 min high pressure + 10 min natural release", total:"25 min",
  steps:["Soak, rinse and drain the rice. Fry it in the oil on Sauté until golden.","Add the strained tomato purée and stir 2 minutes.","Add broth so the total liquid (purée plus broth) is [[1¾ cups]], then the salt, vegetables, cilantro and serrano. Scrape the bottom well so it won't set off the burn warning.","High pressure 4 minutes, natural release 10. Fluff."]},

/* ---------------- SALSAS ---------------- */
{id:"salsa-roja", name:"Salsa Roja de Molcajete", en:"Charred tomato salsa", cat:"salsas", region:"Centro", time:"20 min", yield:"1½ cups",
 story:"Charred on the comal and ground in the volcanic-stone molcajete. Chunky, smoky, and on the table at every meal.",
 ing:[["Salsa",["4 Roma tomatoes","2–3 serranos (or 4 chiles de árbol, toasted)","2 garlic cloves, unpeeled","¼ white onion, in one piece","Coarse salt","2–4 tbsp water"]]],
 steps:["Heat a dry comal or cast-iron pan over medium-high. Char the tomatoes, chiles, garlic and onion, turning, until blistered and soft: about 8 minutes for the garlic and chiles, 12–15 for the tomatoes.",
  "Peel the garlic and grind it with salt in the molcajete into a paste. (If you used chiles de árbol, toast them only a few seconds; they burn fast.)",
  "Add the chiles and grind them. Add the tomatoes one at a time and crush, then the onion.",
  "Thin with a little water and keep it chunky. Taste for salt.",
  "No molcajete? Pulse a few times in a blender. Don't purée."],
 pc:null, pcNote:"No pressure-cooker version. Salsas come off the comal in minutes.",
 tips:["Season a new molcajete by grinding a handful of raw rice in it, again and again, until the rice comes out white instead of gray."],
 vars:[
  {name:"Salsa Verde Cocida", en:"Cooked tomatillo salsa", region:"Centro",
   note:"The everyday green salsa for tacos, carnitas and chilaquiles.",
   ing:["1 lb tomatillos, husked","2–4 serranos","1 garlic clove","¼ white onion","Handful of cilantro","Salt, al gusto"],
   steps:["Simmer the tomatillos and chiles 8 minutes, until olive green.","Blend with the garlic, onion, cilantro, salt and a few spoons of the cooking water."]},
  {name:"Salsa de Chile de Árbol", en:"Taquería árbol salsa", region:"Jalisco · Centro",
   note:"The thin, fiery red salsa from the taquería.",
   ing:["20 chiles de árbol, stems removed","4 tomatillos","2 garlic cloves","½ tsp salt","½ cup water","1 tsp vinegar, optional"],
   steps:["Toast the chiles in a dry pan 30 seconds, stirring, until fragrant. Don't let them blacken.","Simmer the tomatillos 8 minutes.","Blend everything until smooth. Strain if you want it silky."]}
 ]},

/* ---------------- BEBIDAS ---------------- */
{id:"cafe-de-olla", name:"Café de Olla", en:"Clay-pot coffee with piloncillo and cinnamon", cat:"bebidas", region:"Centro · Sur", time:"15 min", yield:"4 cups",
 story:"Coffee brewed in a clay olla with piloncillo and canela. Popular history credits the Adelitas of the Revolution with brewing it for the troops. Coffee only reached Mexico in the 1700s, so it isn't pre-Hispanic, but it is what abuela still pours with pan dulce.",
 ing:[["Café",["4 cups water","3 oz piloncillo, chopped or grated (or ⅓ cup dark brown sugar)","1 stick Mexican cinnamon (canela)","½ cup coarsely ground dark-roast coffee (Mexican, from Veracruz, Chiapas or Oaxaca, if you can)","2 whole cloves, optional","1 strip orange peel, optional","1 star anise, optional"]]],
 steps:["Put the water, piloncillo, cinnamon and any spices in a clay olla or a saucepan. Bring to a boil and cook until the piloncillo dissolves, about 5 minutes.",
  "Turn off the heat. Stir in the coffee, cover and let it steep 5 minutes.",
  "Strain through a fine strainer or a cloth.",
  "Serve hot in clay jarritos or mugs, with pan dulce."],
 pc:null, pcNote:"No pressure-cooker version. It's a 15-minute steep.",
 tips:["Don't let the coffee keep boiling. Add it off the heat, or let it rise to a boil once and turn it off; boiled coffee turns bitter.","Buy ollas and jarritos marked Sin Plomo (lead-free). Profeco's test: soak part of the piece in white vinegar for 24 hours; if the glaze turns dull or rough, don't cook in it.","A clay olla gives the coffee its earthy taste. Season a new one by boiling water in it a few times before the first coffee.","Use a coarse grind, like for a French press, so it strains clean."],
 vars:[
  {name:"Chocolate Caliente", en:"Mexican hot chocolate", region:"Oaxaca · Centro",
   note:"Made with water in Oaxaca, with milk most other places. Frothed with a molinillo until foamy.",
   ing:["4 cups whole milk or water","1 tablet (3 oz) Mexican chocolate, chopped","1 stick Mexican cinnamon","Pinch of salt"],
   steps:["Heat the milk (or water) with the cinnamon and salt until steaming. Don't let it boil over.","Add the chocolate and whisk until melted.","Take out the cinnamon and froth with a molinillo, rolling it between your palms, or a whisk, until the top is foamy.","Serve right away with pan dulce."]},
  {name:"Café con Leche", en:"Coffee with hot milk", region:"Toda la República",
   note:"Half café, half hot milk, for dunking conchas.",
   ing:["2 cups café de olla","2 cups whole milk"],
   steps:["Heat the milk until steaming.","Pour half coffee, half milk into each cup and sweeten to taste."]}
 ]},

{id:"champurrado", name:"Champurrado", en:"Chocolate masa atole", cat:"bebidas", region:"Centro · Oaxaca", time:"30 min", yield:"6 cups",
 story:"A thick chocolate atole made with masa, sweetened with piloncillo and frothed with a wooden molinillo. It's for cold mornings, posadas and Día de Muertos, with tamales.",
 ing:[["Champurrado",["½ cup masa harina (or 4 oz fresh masa)","2 cups warm water","4 cups water (the traditional way), milk, or half and half","1 tablet (3 oz) Mexican chocolate, chopped (chocolate de metate if you can find it)","3–4 oz piloncillo, grated (or ⅓ cup brown sugar)","1 stick Mexican cinnamon (canela)","Pinch of salt","¼ tsp anise seed, optional"]]],
 steps:["Whisk the masa into the warm water until there are no lumps. Strain.",
  "In a pot, simmer the water or milk with the cinnamon, piloncillo, salt and anise for 10 minutes.",
  "Add the chocolate and whisk until melted.",
  "Pour in the masa mixture slowly, whisking constantly.",
  "Simmer on low, stirring constantly, 10 minutes until thick enough to coat a spoon. Take out the cinnamon.",
  "Froth with a molinillo, rolling it between your palms, or with a whisk. Serve hot."],
 pc:null, pcNote:"No pressure-cooker version. Atole needs constant stirring, and masa scorches under pressure.",
 tips:["Keep stirring. Masa sticks to the bottom and burns fast."],
 vars:[{name:"Atole Blanco con Canela", en:"Cinnamon masa atole", region:"Centro",
  note:"The plain atole underneath every flavored one.",
  ing:["½ cup masa harina","6 cups water or milk","1 stick Mexican cinnamon","½ cup sugar or piloncillo","1 tsp vanilla"],
  steps:["Dissolve the masa in [[2 cups]] of the liquid and strain.","Simmer the rest of the liquid with the cinnamon and sugar.","Whisk in the masa and cook, stirring, 10 minutes until thick. Add the vanilla."]}]},

{id:"agua-de-jamaica", name:"Agua de Jamaica", en:"Hibiscus agua fresca", cat:"bebidas", region:"Toda la República", time:"30 min", yield:"2 quarts",
 story:"Deep red hibiscus water, tart and cold. A jug of agua fresca sits on the table at la comida, the big midday meal.",
 ing:[["Agua",["1 cup dried jamaica (hibiscus) flowers","8 cups water","½–¾ cup sugar or grated piloncillo","1 stick Mexican cinnamon, optional","Ice"]]],
 steps:["Rinse the flowers.",
  "Boil [[4 cups]] of the water with the flowers and cinnamon 5 minutes. Turn off the heat and steep 15 minutes.",
  "Strain, pressing on the flowers. Stir in the sugar while it's warm.",
  "Add the remaining [[4 cups]] of cold water. Taste and adjust. Serve over ice."],
 pc:null, pcNote:"No pressure-cooker version needed. It's a quick steep.",
 tips:["The flowers make a second, lighter batch. Or sauté them with onion and garlic for tacos de jamaica."],
 vars:[{name:"Horchata de Arroz", en:"Rice and cinnamon horchata", region:"Centro · Sur",
  note:"Mexican horchata is made from rice and canela.",
  ing:["1 cup long-grain white rice","1 stick Mexican cinnamon, broken","8 cups water, divided","½–¾ cup sugar","1 tsp vanilla","½ cup milk or evaporated milk, optional"],
  steps:["Soak the rice and cinnamon in [[4 cups]] hot water overnight.","Blend the rice, cinnamon and soaking water 2 minutes until very fine.","Strain through a cloth or a very fine strainer.","Add the remaining water, the sugar, vanilla and milk. Serve over ice, stirring before you pour because it settles."]}]},

/* ---------------- PANADERÍA ---------------- */
{id:"conchas", name:"Conchas", en:"Sweet shell-topped buns", cat:"pan", region:"Toda la República", time:"4 h", yield:"12 conchas",
 story:"The best-known pan dulce: a soft, slightly sweet bun under a crunchy sugar topping scored like a seashell. Picked up warm from the panadería with tongs and a tray, and eaten with café or chocolate.",
 ing:[["Masa (dough)",["4 cups (500 g) all-purpose or bread flour","½ cup (100 g) sugar","2¼ tsp (1 packet) instant yeast","1 tsp salt","¾ cup (180 ml) warm whole milk","3 eggs, at room temperature","1 tsp vanilla","6 tbsp (85 g) soft butter, plus a little melted butter for brushing"]],
      ["Cubierta (topping)",["½ cup (65 g) all-purpose flour","½ cup (65 g) powdered sugar","⅓ cup (65 g) vegetable shortening (manteca vegetal); butter works but spreads and blurs the shell","½ tsp vanilla"] ]],
 steps:["Mix the flour, sugar, yeast and salt in a large bowl or stand mixer. Add the milk, eggs and vanilla and mix into a shaggy dough.",
  "Knead 8–10 minutes (or with the dough hook on medium) until smooth. Add the butter a spoon at a time, kneading until each piece disappears. The dough should be soft, a little tacky and stretchy.",
  "Cover and let rise in a warm place 1½–2 hours, until doubled.",
  "Make the topping: mix the flour, powdered sugar, shortening and vanilla into a smooth paste like play dough. Divide into [[12 balls]].",
  "Divide the dough into [[12 pieces]] (about 85 g each). Roll each into a smooth ball and set on parchment-lined sheet pans, 3 inches apart. Press each down slightly and brush with a little melted butter.",
  "Flatten each topping ball between two pieces of plastic into a 3½-inch disc. Lay it on a bun and press gently so it sticks.",
  "Score the topping in a shell pattern with a concha cutter or a sharp knife: curved lines fanning out from one side. Cut only through the topping, not the dough.",
  "Cover loosely and let rise 1 hour, until puffy. The topping will crack open along the lines.",
  "Bake at 350°F for 18–20 minutes, until the bottoms are golden. The tops should stay pale.",
  "Cool a few minutes and eat warm."],
 pc:null, pcNote:"No pressure-cooker version. Bread needs the oven.",
 tips:["Brushing the buns with butter before the topping goes on keeps it from sliding off.","Panaderos make the topping 1:1:1 by weight: flour, powdered sugar and shortening. In humid weather, add a spoonful more flour so it doesn't slide.","If your kitchen is cold, let the dough rise in the oven with only the light on.","Conchas go stale fast. Freeze extras the same day and warm them 5 minutes in the oven."],
 vars:[
  {name:"Pan de Muerto", en:"Day of the Dead bread", region:"Centro",
   note:"Made for the ofrenda in late October and early November. An orange-blossom sweet bread decorated with dough bones and a round skull, brushed with butter and rolled in sugar. The four bones in a cross point to the four directions; some say they are tears. In Oaxaca it's pan de yema with a little face on top.",
   ing:["Concha dough from the base, with these changes: add the zest of 2 oranges, 1 tbsp orange blossom water (agua de azahar) and, if you like, ½ tsp anise seed, ground; use ½ cup milk plus ¼ cup orange juice instead of ¾ cup milk","1 egg, beaten, for brushing","4 tbsp melted butter","½ cup sugar, for coating"],
   steps:["Make the dough and let it rise as in the base, steps 1–3.","Set aside about a quarter of the dough. Divide the rest into 2 or 3 pieces and shape each into a smooth round loaf on a lined sheet pan.","With the reserved dough, roll ropes and press your fingers along them to make knobby bones (huesos). Lay 4 across each loaf in a cross, and set a small ball (the skull) in the center. Stick them on with a little beaten egg.","Let rise 1 hour, brush with beaten egg and bake at 350°F for 30–35 minutes, until deep golden.","While warm, brush all over with melted butter and roll or sprinkle with sugar."]},
  {name:"Conchas de Chocolate", en:"Chocolate conchas", region:"Toda la República",
   note:"Every panadería tray has white and chocolate side by side. Make half and half.",
   ing:["Dough from the base","Topping from the base, with 2 tbsp of the flour replaced by cocoa powder"],
   steps:["Make the topping with cocoa.","Top, score, rise and bake as in the base."]}
 ]},

{id:"bolillos", name:"Bolillos", en:"Crusty Mexican rolls", cat:"pan", region:"Toda la República", time:"3 h", yield:"10 rolls",
 story:"Mexico's everyday bread: crackly crust, soft inside, pointed at both ends. It's for molletes, tortas, capirotada and dunking in caldo. Abuelas also say a bite of bolillo calms a scare (para el susto). It came out of French baking during the Intervention of the 1860s. In Guadalajara its cousin is the birote salado, slightly sour and firm-crusted: the bread of the torta ahogada.",
 ing:[["Bolillos",["4 cups (500 g) bread flour","1½ cups (350 ml) warm water","2¼ tsp (1 packet) instant yeast","1 tbsp sugar","2 tsp salt","2 tbsp lard or soft butter"]]],
 steps:["Mix the flour, yeast, sugar and salt. Add the water and lard and mix into a dough.",
  "Knead 10 minutes until smooth and elastic. Cover and let rise 1–1½ hours, until doubled.",
  "Divide into [[10 pieces]] (about 85 g). Flatten each into an oval, then roll it up tightly from a long side into a log, pressing the seam closed.",
  "Roll the ends under your palms so they taper to points. Set seam side down on a lined sheet pan.",
  "Cover and let rise 45 minutes, until puffy.",
  "Heat the oven to 425°F with an empty pan on the bottom rack. Slash each roll once down the length, about ¼ inch deep.",
  "Spray or brush the rolls with water. Put them in the oven and pour a cup of hot water into the empty pan for steam. Close the door fast.",
  "Bake 20–25 minutes, until golden and they sound hollow when you tap the bottom. Cool on a rack."],
 pc:null, pcNote:"No pressure-cooker version. Bread needs the oven, and steam in the oven is what makes the crust crackle.",
 tips:["The steam is the secret to the thin, crackly crust. Don't skip the pan of water.","Day-old bolillos are perfect for molletes and capirotada."],
 vars:[
  {name:"Teleras", en:"Flat torta rolls", region:"Ciudad de México",
   note:"The soft, flat roll for tortas, with two grooves across the top.",
   ing:["Bolillo dough from the base"],
   steps:["Divide the dough into [[8 pieces]] and shape into flat ovals about ¾ inch thick.","Press two deep lines along the length of each with the handle of a wooden spoon, almost to the bottom.","Rise 45 minutes and bake at 400°F for 18–20 minutes, without steam, so the crust stays soft."]}
 ]},

/* ---------------- POSTRES ---------------- */
{id:"arroz-con-leche", name:"Arroz con Leche", en:"Cinnamon rice pudding", cat:"postres", region:"Toda la República", time:"1 h 05", yield:"6 cups",
 story:"Rice cooked first in water with cinnamon and lime peel, then slowly in milk. Every abuela has a strong opinion about raisins. Kids know it from the playground song: «Arroz con leche, me quiero casar con una señorita de San Nicolás…»",
 ing:[["Arroz con leche",["1 cup long-grain white rice","2 cups water","1 stick Mexican cinnamon (canela)","1 strip lime peel, no white pith","Pinch of salt","4 cups whole milk","¾ cup sugar","1 tsp vanilla","⅓ cup raisins, optional","Ground cinnamon, to finish"]]],
 steps:["Rinse the rice and soak 15 minutes. Drain.",
  "Simmer the rice in the water with the cinnamon, lime peel and salt until the water is absorbed, about 15 minutes.",
  "Add the milk and sugar. Simmer on low, stirring often, 25–30 minutes until creamy.",
  "Take out the peel and cinnamon. Stir in the vanilla and raisins and cook 5 minutes more.",
  "It thickens as it cools. Serve warm or cold with ground cinnamon."],
 pc:{time:"12 min high pressure + 10 min natural release", total:"35 min",
  steps:["Put the rice, water, cinnamon, lime peel and salt in the pot.","High pressure 12 minutes, natural release 10.","Switch to Sauté. Add the milk and sugar and stir constantly 8–10 minutes until creamy; it scorches easily.","Finish with the vanilla and raisins."]},
 tips:["Use Mexican canela (Ceylon cinnamon), the soft, flaky kind. Cassia sticks are harder and spicier."],
 vars:[{name:"Arroz con Leche Cremoso", en:"Extra-creamy rice pudding", region:"Toda la República",
  note:"The richer version many families make now.",
  ing:["The same rice, water and spices as the base","2 cups whole milk (instead of 4)","1 can (14 oz) sweetened condensed milk (instead of the sugar)","1 can (12 oz) evaporated milk"],
  steps:["Cook the rice in the water as in the base.","Add [[2 cups]] milk, the condensed milk and the evaporated milk. Simmer, stirring, 20 minutes."],
  pc:"Same as the base. Add the canned milks on Sauté."}]},

{id:"flan", name:"Flan de la Abuela", en:"Milk and egg caramel custard", cat:"postres", region:"Toda la República", time:"1 h 30 + chilling", yield:"8 slices",
 story:"The old-style flan: whole milk infused with cinnamon and lime peel, plus eggs and sugar, baked in a water bath under a layer of dark caramel.",
 ing:[["Caramelo",["¾ cup sugar","2 tbsp water"]],
      ["Flan",["4 cups whole milk","¾ cup sugar","1 stick Mexican cinnamon","1 strip lime peel","6 eggs plus 3 yolks","1 tsp vanilla"]]],
 steps:["Heat the milk with the sugar, cinnamon and lime peel until steaming. Turn off the heat and steep 15 minutes. Remove the cinnamon and peel and let cool until warm.",
  "Make the caramel: cook the sugar and water in a small pan without stirring, swirling the pan, until deep amber. Pour into an 8- or 9-inch flan mold and tilt to coat the bottom.",
  "Whisk the eggs and yolks gently. You don't want bubbles. Slowly whisk in the warm milk and the vanilla. Strain into the mold.",
  "Cover with foil. Set the mold in a larger pan and pour in hot water halfway up the sides (baño maría).",
  "Bake at 350°F 50–60 minutes, until the edges are set and the center jiggles like gelatin.",
  "Cool, then chill at least 6 hours, ideally overnight.",
  "Run a knife around the edge, put a plate on top and flip it in one quick move."],
 pc:{time:"9 min high pressure + 10 min natural release (ramekins)", total:"35 min + chilling",
  steps:["Make the custard and caramel as above, but divide among 6 heatproof ramekins that fit in your pot. Cover each with foil.","Put the trivet in the pot with 1½ cups water and stack the ramekins on it.","High pressure 9 minutes, natural release 10.","Cool, then chill at least 4 hours before unmolding."],
  note:"For one mold that fits your pot, time depends on its size and depth. In a stovetop olla exprés, Mexican cooks count about 10–15 minutes from the whistle for the classic and about 25 for napolitano. In an electric pot, start at 15–20 minutes for the classic and 25 for napolitano, then check: the center should jiggle, not slosh."},
 tips:["Strain the custard. That's what makes a flan smooth, with no holes.","Low and slow. An oven that's too hot gives a spongy flan full of bubbles."],
 vars:[{name:"Flan Napolitano", en:"Cream cheese flan", region:"Toda la República",
  note:"The popular modern flan: richer, denser and blended in a minute. Most families make this one now, and they argue about whether it needs queso crema.",
  ing:["Caramel from the base","1 can (14 oz) sweetened condensed milk","1 can (12 oz) evaporated milk","4 oz cream cheese, softened","5 eggs","1 tsp vanilla"],
  steps:["Blend everything 1 minute.","Pour over the caramel, cover, and bake in a water bath at 350°F 50–60 minutes.","Chill overnight and unmold."],
  pc:"Same as the base: ramekins at high pressure 9 minutes, natural release 10."}]},

{id:"capirotada", name:"Capirotada", en:"Lenten bread pudding with piloncillo", cat:"postres", region:"Jalisco · Michoacán · Norte", time:"1 h 25", yield:"8 personas",
 story:"The bread pudding of Cuaresma (Lent): layers of fried bolillo, raisins, nuts and cheese soaked in spiced piloncillo syrup. Old recipes from Jalisco and Colima simmer a tomato and an onion in the syrup. It sounds strange and tastes right. Every layer means something: the bread is the body of Christ, the syrup his blood, the canela the wood of the cross, the cloves the nails, and the white cheese the holy shroud. It's eaten on the Fridays of Lent and on Viernes Santo.",
 ing:[["La miel",["8 oz piloncillo","3 cups water","2 sticks Mexican cinnamon","4 whole cloves","1 Roma tomato and ¼ onion, optional, the old way"]],
      ["Las capas",["6 day-old bolillos, sliced ½ inch thick","4 tbsp butter or lard","½ cup raisins","½ cup peanuts or slivered almonds","2 cups shredded queso añejo, cotija or Chihuahua","Colored sprinkles (grageas), optional"]]],
 steps:["Simmer the piloncillo, water, cinnamon and cloves (and the tomato and onion) 15 minutes, until syrupy. Strain.",
  "Fry the bread slices in butter until golden on both sides, or brush them with butter and toast in the oven.",
  "Butter a baking dish. Layer bread, raisins, nuts and cheese, and repeat for 3 layers.",
  "Pour the syrup slowly over everything so it all soaks in.",
  "Cover with foil and bake at 350°F for 30 minutes. Uncover and bake 10 minutes more.",
  "Let rest 15 minutes and top with sprinkles. Serve warm or at room temperature."],
 pc:null, pcNote:"No pressure-cooker version. Capirotada needs the dry heat of the oven to set.",
 tips:["Toast the bread well. Pale bread turns to mush."],
 vars:[]}
];

      [new RegExp(`${QTY} cups?\\b`, 'g'), (m, a, b) => range(qty(a, b, x => x * 240), mls)],

      [/\b(an? )?(\d+)- or (\d+)-inch\b/g, (m, art, a, b) => `${art ? 'a ' : ''}${Math.round(a * 2.54)} or ${Math.round(b * 2.54)} cm`],
      [new RegExp(`(${NUM})-inch\\b`, 'g'), (m, a) => `${cm(parse(a))} cm`],
      [new RegExp(`(${NUM}) inch(?:es)?\\b`, 'g'), (m, a) => `${cm(parse(a))} cm`],
      fahrenheit
    ],
    es: [
      // "¼ de taza", "½ de pulgada": Spanish may put "de" after a fraction
      [new RegExp(`${QTY} (?:de )?(?:tazas?|cucharadas?|cucharaditas?) \\((como )?(${NUM}) ?(g|oz|ml)\\)`, 'g'), weight],
      pounds,
      ounces,
      [new RegExp(`${QTY} qt\\b`, 'g'), (m, a, b) => range(qty(a, b, x => x * 946), mls)],
      [new RegExp(`${QTY} (?:de )?tazas?(?![A-Za-zÀ-ÿ])`, 'g'), (m, a, b) => range(qty(a, b, x => x * 240), mls)],
      [/(\d+) o (\d+) pulgadas(?![A-Za-zÀ-ÿ])/g, (m, a, b) => `${Math.round(a * 2.54)} o ${Math.round(b * 2.54)} cm`],

  const metric = (s, lang = 'en') => rules[lang].reduce((t, [re, fn]) => t.replace(re, fn), s);

const PANTRY = (() => {
  const fold = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’`]/g, "'");
  const byId = Object.fromEntries(LEXICON.map(([id, es, en, kind, parent, aliases]) => [id, { id, es, en, kind, parent, aliases }]));
  // Every alias, longest first, so "chicken broth" wins over "chicken" and "garlic cloves" over "cloves".
  const ALIASES = LEXICON.flatMap(([id, , , , , aliases]) => aliases.map(a => [fold(a), id]))
    .sort((a, b) => b[0].length - a[0].length || (a[0] < b[0] ? -1 : 1));
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const RE = ALIASES.map(([a, id]) => [new RegExp(`(^|[^a-z0-9'])${esc(a)}(?:es|s)?(?=[^a-z0-9']|$)`, 'g'), id]);

  /* Ids named in a piece of text, in order of first appearance. */
  const idsIn = text => {
    let t = ' ' + fold(text) + ' ';
    const found = [];
    for (const [re, id] of RE) {
      re.lastIndex = 0;
      let m, hit = false;
      while ((m = re.exec(t))) {
        hit = true;
        const start = m.index + m[1].length;
        found.push([start, id]);
        t = t.slice(0, start) + ' '.repeat(m[0].length - m[1].length) + t.slice(start + m[0].length - m[1].length);
        re.lastIndex = start + 1;
      }
    }
    found.sort((a, b) => a[0] - b[0]);
    return [...new Set(found.map(f => f[1]))].filter(id => byId[id].kind !== 'ignore');
  };

  const ancestors = id => { const out = []; let p = byId[id] && byId[id].parent; while (p) { out.push(p); p = byId[p].parent; } return out; };
  const isUnder = (id, root) => id === root || ancestors(id).includes(root);

  const OPTIONAL_GROUP = /servir|encima|to serve|garnish|pico de gallo/i;
  /* What a recipe needs: a list of alternatives ("pork or chicken" is one need). */
  const needsOf = recipe => {
    const groups = recipe.ing.length && Array.isArray(recipe.ing[0]) ? recipe.ing : [['', recipe.ing]];
    const needs = [];
    const seen = new Set();
    for (const [title, items] of groups) {
      const garnish = OPTIONAL_GROUP.test(title || '');
      for (const line of items) {
        if (garnish || /\boptional\b|opcional/i.test(line) || /^for\b/i.test(line)) continue;
        const ids = idsIn(line).filter(i => byId[i].kind !== 'ignore');
        if (!ids.length) continue;
        const alternatives = /\bor\b|\bo\b/i.test(fold(line));
        if (alternatives) {
          const real = ids.filter(i => byId[i].kind !== 'basic');
          if (real.length && real.length < ids.length) ids.splice(0, ids.length, ...real);
          const key = ids.slice().sort().join('|');
          if (!seen.has(key) && !ids.some(i => seen.has(i))) { needs.push(ids); seen.add(key); }
        } else {
          for (const id of ids) if (!seen.has(id)) { needs.push([id]); seen.add(id); }
        }
      }
    }
    return needs;
  };

  /* Turns what someone typed into ingredient ids. Misspellings within one or two letters still match. */
  const lev = (a, b) => {
    if (Math.abs(a.length - b.length) > 2) return 3;
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
        i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1] ? d[i - 2][j - 2] + 1 : Infinity);
    return d[a.length][b.length];
  };
  const SINGLE = ALIASES.filter(([a]) => !a.includes(' '));
  const STOP = new Set(['i','have','some','a','an','the','and','y','de','del','la','el','los','las','con','tengo','hay','un','una','unos','unas','of','with','my','me','fresh','frescos','fresco','few','little','poco','poquito','bit','lots','lb','kg','g','cup','cups','piece','pieces','can','cans','bag','leftover','sobras','que','what','or','o','also','tambien','plus','mas']);
  const parse = text => {
    const ids = idsIn(text);
    // leftover words that didn't match anything: try a typo-tolerant match
    let rest = ' ' + fold(text) + ' ';
    for (const [re] of RE) { re.lastIndex = 0; rest = rest.replace(re, (m, pre) => pre + ' '.repeat(m.length - pre.length)); }
    const unknown = [];
    for (const w of rest.split(/[^a-z0-9ñ'-]+/).filter(Boolean)) {
      if (STOP.has(w) || /^\d/.test(w)) continue;
      if (w.length >= 4) {
        const limit = w.length >= 8 ? 2 : 1;
        let best = null, bestD = limit + 1;
        for (const [a, id] of SINGLE) { const d = lev(w, a); if (d < bestD) { best = id; bestD = d; } }
        if (best) { if (!ids.includes(best)) ids.push(best); continue; }
      }
      unknown.push(w);
    }
    return { ids, unknown };
  };

  /* Suggestions while typing: entries whose Spanish, English or alias starts with (then contains) the text. */
  const suggest = (text, exclude = []) => {
    const q = fold(text).trim();
    if (q.length < 2) return [];
    const score = e => {
      const names = [e.es, e.en, ...e.aliases].map(fold);
      if (names.some(n => n.startsWith(q))) return 0;
      if (names.some(n => n.split(/\s+/).some(w => w.startsWith(q)))) return 1;
      if (names.some(n => n.includes(q))) return 2;
      return 9;
    };
    return Object.values(byId).filter(e => e.kind !== 'basic' && e.kind !== 'ignore' && !exclude.includes(e.id))
      .map(e => [score(e), e]).filter(([s]) => s < 9).sort((a, b) => a[0] - b[0] || a[1].es.localeCompare(b[1].es)).slice(0, 6).map(([, e]) => e);
  };

  const WEIGHT = { protein: 3, main: 1, aromatic: 0.5, season: 0.5, basic: 0.25 };
  /* Ranks recipes by how much of what they need you have. Herbs and spices only count once you enter one;
     basics (salt, oil, lard, sugar, broth…) are assumed unless haveBasics is false. */
  const rank = (recipes, haveIds, { haveBasics = true } = {}) => {
    const have = new Set(haveIds);
    const seasoningsEntered = haveIds.some(id => byId[id] && byId[id].kind === 'season');
    const covered = need => need.some(id => have.has(id) || ancestors(id).some(a => have.has(a)) || haveIds.some(h => isUnder(h, id)));
    const results = [];
    for (const r of recipes) {
      let total = 0, got = 0, matchedReal = 0;
      const missing = [], matched = [];
      for (const need of needsOf(r)) {
        const kind = byId[need[0]].kind;
        if (kind === 'season' && !seasoningsEntered) continue;
        if (kind === 'basic' && haveBasics) continue;
        const w = WEIGHT[kind];
        total += w;
        if (covered(need)) { got += w; matched.push(need); if (kind === 'protein' || kind === 'main') matchedReal++; }
        else missing.push(need);
      }
      if (!total || !matchedReal) continue;
      // How much of what you entered this recipe uses (herbs and basics don't count here).
      const yours = haveIds.filter(h => byId[h] && !['season', 'basic'].includes(byId[h].kind));
      const used = yours.length ? yours.filter(h => matched.some(n => n.some(id => id === h || isUnder(id, h) || isUnder(h, id)))).length / yours.length : 0;
      const score = got / total;
      results.push({ recipe: r, score, used, rankScore: score * 0.7 + used * 0.3, matched, missing });
    }
    return results.sort((a, b) => b.rankScore - a.rankScore || a.missing.length - b.missing.length || a.recipe.name.localeCompare(b.recipe.name));
  };

  const label = id => byId[id] ? byId[id].es : id;
  const needLabel = need => need.map(label).join(' o ');
  return { idsIn, parse, suggest, rank, needsOf, label, needLabel, byId, fold };
})();

/* What's cooking today, by the calendar: jueves pozolero, Sunday barbacoa, tamales on la Candelaria… */

  const e = easter(y), ash = new Date(e); ash.setDate(e.getDate() - 46);
  if (md >= 1020 && md <= 1102) return ['conchas', 'Hoy hay pan de muerto', 'Para la ofrenda del Día de Muertos'];
  if (md >= 1212 && md <= 1224) return ['tamales-rojos', 'Hoy hay tamalada', 'Tamales para la Nochebuena'];
  if (md >= 125 && md <= 202) return ['tamales-rojos', 'Hoy hay tamales', 'Día de la Candelaria, el 2 de febrero'];
  if (md >= 901 && md <= 916) return ['pozole-rojo', 'Hoy hay pozole', 'Para el 15 de septiembre'];
  if (d >= ash && d <= e && dow === 5) return ['pescado-veracruzana', 'Hoy hay pescado', 'Viernes de Cuaresma'];

function stepServings(r, dir){
  const b = SCALE.base(r.yield); if (!b) return;
  const step = b < 4 ? b / 2 : (b <= 12 ? 1 : Math.ceil(b / 12));
  const next = Math.min(b * 4, Math.max(step, b * factorOf(r.id) + dir * step));
  setFactor(r, next / b);
}

/* ---------- routing ---------- */
let current = '';
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (current === 'home' || current === 'guardadas') state.homeScroll = window.scrollY;
  let view, restore = 0;
  if (byId[h]) { detail(h); view = 'detail'; }
  else if (h === 'guardadas') { home(true); view = 'guardadas'; }
  else if (h === 'despensa') { pantry(); view = 'despensa'; }
  else if (h === 'que-tengo') { queTengo(); view = 'que-tengo'; }
  else { home(false); view = 'home'; restore = (current === 'detail') ? state.homeScroll : 0; }
  current = view;
  window.scrollTo(0, restore);
  document.querySelectorAll('.nav a').forEach(a => {
    const on = (a.dataset.nav === 'recetas' && (view === 'home' || view === 'detail')) || a.dataset.nav === view;
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (view !== 'detail' && document.documentElement.classList.contains('cook')) setCook(false);
}
window.addEventListener('hashchange', route);

app.addEventListener('change', e => {
  const t = e.target;

  if (t.matches('input[type="checkbox"][data-key]')){
    const k = t.dataset.key;
    if (t.checked) checks.add(k); else checks.delete(k);
    t.closest('.ing').classList.toggle('done', t.checked);
    saveChecks();
  }
});
app.addEventListener('click', e => {
  const step = e.target.closest('.step');
  if (step){
    const k = step.dataset.key, on = !checks.has(k);
    if (on) checks.add(k); else checks.delete(k);
    step.classList.toggle('done', on); step.setAttribute('aria-pressed', on);
    saveChecks();
    const list = step.closest('.steps');
    if (on && list && [...list.querySelectorAll('.step')].every(b => b.classList.contains('done'))) toast('¡Buen provecho!');
    return;
  }
  const pick = e.target.closest('[data-pick]');
  if (pick){ const id = pick.dataset.pick; qt.have = qt.have.includes(id) ? qt.have.filter(x => x !== id) : [...qt.have, id]; qt.unknown = []; saveQt(); renderQt(); return; }
  const unpick = e.target.closest('[data-unpick]');
  if (unpick){ qt.have = qt.have.filter(x => x !== unpick.dataset.unpick); saveQt(); renderQt(); return; }
  const sugg = e.target.closest('[data-sugg]');

  if (e.target.closest('[data-clear]')){ qt.have = []; qt.unknown = []; saveQt(); renderQt(); return; }
  const ex = e.target.closest('[data-example]');
  if (ex){ addText(ex.dataset.example); return; }
  const chip = e.target.closest('.chip');
  if (chip){
    if (chip.hasAttribute('data-pc')) { state.pcOnly = !state.pcOnly; chip.setAttribute('aria-pressed', state.pcOnly); }
    else { state.cat = chip.dataset.cat; document.querySelectorAll('.chip[data-cat]').forEach(c => c.setAttribute('aria-pressed', c === chip)); }
    list(current === 'guardadas'); return;
  }
  const serv = e.target.closest('[data-serv]');
  if (serv){ stepServings(byId[decodeURIComponent(location.hash.slice(1))], Number(serv.dataset.serv)); return; }
  const un = e.target.closest('[data-units]');
  if (un){
    units = un.dataset.units; store.set('ra.units', units);
    const id = decodeURIComponent(location.hash.slice(1)); const y = window.scrollY; detail(id); window.scrollTo(0, y); onScroll(); return;
  }
  const pq = e.target.closest('[data-factor]');
  if (pq){ setFactor(byId[decodeURIComponent(location.hash.slice(1))], Number(pq.dataset.factor)); return; }
  const tab = e.target.closest('.tab');
  if (tab){
    const id = decodeURIComponent(location.hash.slice(1));
    state.tab[id] = tab.dataset.tab;
    const y = window.scrollY; detail(id); window.scrollTo(0, y); onScroll(); return;
  }
  const reset = e.target.closest('[data-reset]');
  if (reset){
    const id = decodeURIComponent(location.hash.slice(1));
    [...checks].filter(k => k.startsWith(reset.dataset.reset + ':')).forEach(k => checks.delete(k));
    saveChecks(); const y = window.scrollY; detail(id); window.scrollTo(0, y); onScroll(); return;
  }
  if (e.target.closest('#fav')){
    const id = decodeURIComponent(location.hash.slice(1));
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs();
    const b = document.getElementById('fav'), on = favs.has(id);
    b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Remove from saved' : 'Save recipe');
    b.innerHTML = on ? ICON.starFill : ICON.star; return;
  }
  if (e.target.closest('#themeBtn')){
    const next = THEME_NEXT[themeMode()];
    if (next === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = next;
    store.set('ra.theme', next);
    document.getElementById('themeBtn').outerHTML = themeBtn();
    toast({ system: 'Like the phone', light: 'Light', dark: 'Dark' }[next]);
    return;
  }
  if (e.target.closest('#cook')){
    setCook(!document.documentElement.classList.contains('cook'));
  }
});

/* Cook mode: larger text and a screen wake lock where the browser allows it */
let wake = null, cookMsg = '';
async function setCook(on){
  document.documentElement.classList.toggle('cook', on);
  const b = document.getElementById('cook'), m = document.getElementById('cookmsg');
  if (b) b.setAttribute('aria-pressed', on);
  if (on){
    cookMsg = 'Cook mode on: bigger text.';
    try {
      if (!navigator.wakeLock) throw new Error('unsupported');
      wake = await navigator.wakeLock.request('screen');
      cookMsg = 'Cook mode on: bigger text, and the screen stays awake.';
    } catch(err){ cookMsg = 'Cook mode on: bigger text. This browser won’t keep the screen awake, so it may still dim.'; }
  } else {
    try { if (wake) await wake.release(); } catch(err){}
    wake = null; cookMsg = '';
  }
  if (m){ m.textContent = cookMsg; m.hidden = !on; }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && document.documentElement.classList.contains('cook') && navigator.wakeLock){
    try { wake = await navigator.wakeLock.request('screen'); } catch(e){}
  }
});

function onScroll(){
  const tb = document.getElementById('topbar');
  if (tb) tb.classList.toggle('scrolled', window.scrollY > 140);
}
window.addEventListener('scroll', onScroll, {passive:true});

route();
})();
</script>
